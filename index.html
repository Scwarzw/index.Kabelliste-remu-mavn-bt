<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Materiallager</title>
<meta name="description" content="Material im Servicefahrzeug scannen, entnehmen und live nachverfolgen.">
<meta name="theme-color" content="#090B0F">
<meta name="app-version" content="3.7">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lager">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     Materiallager — Designsystem
     Dunkle Werkstattoberfläche, Pegelanzeige als Signaturelement
     ================================================================ */
  :root{
    --bg:#0D0F13;
    --surface:#151920;
    --surface-2:#1B212A;
    --surface-3:#232B36;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.14);
    --text:#EDF1F6;
    --muted:#96A0AE;
    --accent:#5B8CFF;
    --accent-soft:rgba(91,140,255,.14);
    --ok:#35D08A;     --ok-bg:rgba(53,208,138,.13);
    --warn:#F2B33D;   --warn-bg:rgba(242,179,61,.13);
    --danger:#FF5C64; --danger-bg:rgba(255,92,100,.13);
    --radius:14px;
    --nav-h:66px;
    --sb:env(safe-area-inset-bottom,0px);
    --shadow:0 18px 40px -22px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none; font-size:15px;}
  h1,h2,h3,.display{font-family:'Barlow Condensed','Inter',sans-serif; font-weight:700; letter-spacing:.012em; text-transform:uppercase; margin:0;}
  .mono, .num, .stock-num, .mv-qty, .qty-input, .stepper .val{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{font-family:inherit; color:inherit;}
  a{color:var(--accent);}
  svg{stroke-linecap:round; stroke-linejoin:round;}

  #app{max-width:560px; margin:0 auto; min-height:100vh;
       padding-bottom:calc(var(--nav-h) + var(--sb) + 24px); position:relative;}
  @media (min-width:900px){ #app{max-width:1180px; padding-bottom:32px;} }

  /* ---------- Kopfzeile ---------- */
  .topbar{position:sticky; top:0; z-index:20; background:rgba(13,15,19,.86);
    backdrop-filter:saturate(160%) blur(14px); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;}
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand{display:flex; align-items:center; gap:11px; min-width:0;}
  .brand-mark{width:34px; height:34px; flex:none; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,var(--accent),#3D6BE0); color:#fff;
    font-family:'Barlow Condensed'; font-weight:700; font-size:18px; letter-spacing:.02em;
    box-shadow:0 6px 16px -8px var(--accent);}
  .brand h1{font-size:19px; line-height:1.05;}
  .brand small{display:block; font-family:'Inter'; text-transform:none; font-weight:500;
    font-size:11.5px; color:var(--muted); letter-spacing:0; margin-top:2px;}
  .icon-btn{width:40px; height:40px; flex:none; border-radius:12px; border:1px solid var(--line-2);
    background:var(--surface); display:flex; align-items:center; justify-content:center; transition:background .15s, transform .1s;}
  .icon-btn svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .icon-btn:active{transform:scale(.93);}
  .icon-btn:hover{background:var(--surface-2);}
  .search-row{margin-top:12px; position:relative;}
  .search-input{width:100%; padding:12px 14px 12px 40px; border:1px solid var(--line-2); border-radius:12px;
    background:var(--surface); font-size:16px; color:var(--text); transition:border-color .15s, background .15s;}
  .search-input::placeholder{color:#6C7684;}
  .search-input:focus{outline:none; border-color:var(--accent); background:var(--surface-2);}
  .search-row .s-ico{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:17px; height:17px;
    stroke:var(--muted); fill:none; stroke-width:1.9; pointer-events:none;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:6px; vertical-align:1px;}

  .view{padding:18px; animation:fade .22s ease;}
  @media (min-width:900px){ .view{padding:26px 30px;} }
  @keyframes fade{from{opacity:0; transform:translateY(5px);}}

  .eyebrow{font-family:'Barlow Condensed'; font-weight:600; font-size:12px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted); margin:0 0 6px;}
  .section-title{font-size:25px; margin:0 0 10px; letter-spacing:.01em;}
  .lead{font-size:13.5px; color:var(--muted); margin:0 0 18px; line-height:1.5;}

  /* ---------- Kennzahlen ---------- */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  @media (min-width:900px){ .stat-grid{grid-template-columns:repeat(4,1fr);} }
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 16px; text-align:left; width:100%; transition:border-color .15s, transform .1s;}
  .stat-card .num{font-weight:600; font-size:28px; line-height:1;}
  .stat-card .label{font-size:11.5px; color:var(--muted); margin-top:6px; font-weight:500;}
  button.stat-card:active{transform:scale(.985);}
  button.stat-card:hover{border-color:var(--line-2);}
  .stat-card.alert .num{color:var(--warn);}
  .stat-card.alert.zero .num{color:var(--danger);}

  .quick-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px;}
  .quick-btn{background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:var(--radius);
    padding:16px 8px; display:flex; flex-direction:column; align-items:center; gap:9px;
    font-size:12px; font-weight:600; text-align:center; line-height:1.25; transition:background .15s, transform .1s, border-color .15s;}
  .quick-btn svg{width:21px; height:21px; stroke:var(--muted); fill:none; stroke-width:1.8; transition:stroke .15s;}
  .quick-btn:hover{background:var(--surface-2); border-color:var(--line-2);}
  .quick-btn:hover svg{stroke:var(--text);}
  .quick-btn:active{transform:scale(.96);}
  .quick-btn.accent{background:linear-gradient(150deg,var(--accent),#3D6BE0); border-color:transparent; color:#fff;
    box-shadow:0 12px 26px -16px var(--accent);}
  .quick-btn.accent svg{stroke:#fff;}

  .subhead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:26px 0 12px;}
  .subhead h3{font-size:17px;}
  .link-btn{font-size:12.5px; font-weight:600; color:var(--accent); padding:2px 0;}

  /* ---------- Kistenkarte ---------- */
  .crate-card{position:relative; width:100%; text-align:left; display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 16px; margin-bottom:10px; overflow:hidden; transition:border-color .15s, background .15s, transform .1s;}
  .crate-card::after{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); opacity:.75;}
  .crate-card:hover{background:var(--surface-2); border-color:var(--line-2);}
  button.crate-card:active{transform:scale(.995);}
  .crate-punch{display:none;}
  .crate-id{display:inline-flex; align-items:center; font-family:'JetBrains Mono'; font-weight:700; font-size:11.5px;
    background:var(--surface-3); color:var(--accent); padding:3px 8px; border-radius:6px; letter-spacing:.06em;}
  .crate-body{flex:1; min-width:0;}
  .crate-body h3{font-size:16.5px; margin:7px 0 4px; text-transform:none; font-family:'Inter'; font-weight:600; letter-spacing:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .crate-meta{font-size:12px; color:var(--muted); font-weight:500;}
  .crate-arrow{color:#5A6472; font-size:20px; flex:none;}

  .chip{display:inline-flex; align-items:center; font-size:10.5px; font-weight:600; padding:3px 8px;
    border-radius:6px; letter-spacing:.04em; text-transform:uppercase; background:var(--surface-3); color:var(--muted);}

  /* ---------- Materialzeile mit Pegelanzeige ---------- */
  .cable-row{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 13px; margin-bottom:9px; transition:border-color .15s, background .15s;}
  .cable-row:hover{border-color:var(--line-2);}
  .cable-row.picked{border-color:var(--accent); background:var(--accent-soft);}
  .row-main{display:flex; align-items:center; gap:12px;}
  .row-main .grow{flex:1; min-width:0; text-align:left;}
  .cable-name{font-size:15px; font-weight:600; margin:0 0 5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cable-sub{display:flex; gap:7px; align-items:center; flex-wrap:wrap;}
  .cable-sub .where{font-size:11.5px; color:var(--muted);}

  .stock-badge{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:none;}
  .stock-num{font-size:15px; font-weight:600; line-height:1;}
  .stock-num span{font-size:10.5px; color:var(--muted); font-weight:400; margin-left:3px;}
  .level{display:flex; gap:2.5px;}
  .level i{width:7px; height:4px; border-radius:1px; background:var(--surface-3); display:block;}
  .stock-ok .stock-num{color:var(--text);}      .stock-ok .level i.on{background:var(--ok);}
  .stock-warn .stock-num{color:var(--warn);}    .stock-warn .level i.on{background:var(--warn);}
  .stock-danger .stock-num{color:var(--danger);} .stock-danger .level i.on{background:var(--danger);}

  .take-btn{flex:none; width:54px; height:46px; border-radius:12px; background:var(--surface-3); color:var(--text);
    font-family:'JetBrains Mono'; font-weight:700; font-size:15px; border:1px solid var(--line-2); transition:background .15s, transform .09s;}
  .take-btn:hover{background:var(--accent); border-color:transparent; color:#fff;}
  .take-btn:active{transform:scale(.92);}
  .take-btn:disabled{background:transparent; color:#4E5764; border-color:var(--line); cursor:not-allowed;}
  .pick-box{width:22px; height:22px; flex:none; accent-color:var(--accent);}
  .qty-line{display:flex; align-items:center; gap:9px; padding:12px 2px 2px; border-top:1px solid var(--line); margin-top:12px;}
  .qty-input{width:66px; padding:8px; border:1px solid var(--line-2); border-radius:9px; text-align:center;
    font-size:15px; background:var(--surface-2); color:var(--text);}

  /* ---------- Schaltflächen ---------- */
  .btn{border-radius:12px; padding:13px 17px; font-weight:600; font-size:14.5px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:background .15s, transform .09s, border-color .15s;}
  .btn svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.9;}
  .btn:active{transform:scale(.985);}
  .btn-primary{background:linear-gradient(150deg,var(--accent),#3D6BE0); color:#fff; width:100%;
    box-shadow:0 14px 30px -18px var(--accent);}
  .btn-primary:disabled{background:var(--surface-3); color:#5C6673; box-shadow:none; cursor:not-allowed;}
  .btn-accent{background:var(--ok); color:#07120C; width:100%;}
  .btn-outline{background:var(--surface); border:1px solid var(--line-2); color:var(--text);}
  .btn-outline:hover{background:var(--surface-2);}
  .btn-sm{padding:9px 13px; font-size:13px; border-radius:10px;}
  .btn-danger{color:var(--danger); border:1px solid rgba(255,92,100,.4); background:transparent;}
  .btn-row{display:flex; gap:9px;}
  .btn-row .btn{flex:1;}
  .sticky-cta{position:sticky; bottom:calc(var(--nav-h) + var(--sb)); padding:12px 0 6px;
    background:linear-gradient(to top, var(--bg) 68%, transparent); z-index:10;}
  @media (min-width:900px){ .sticky-cta{bottom:18px;} }

  /* ---------- Navigation ---------- */
  .bottom-nav{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
    background:rgba(21,25,32,.94); backdrop-filter:blur(16px); border-top:1px solid var(--line);
    padding-bottom:var(--sb); height:calc(var(--nav-h) + var(--sb));}
  @media (min-width:900px){ .bottom-nav{display:none;} }
  .nav-btn{flex:1; padding:10px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:5px;
    color:#78828F; font-size:10.5px; font-weight:600; transition:color .15s;}
  .nav-btn svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .nav-btn.active{color:var(--text);}
  .nav-btn.active svg{stroke:var(--accent);}
  .nav-scan{flex:0 0 78px; display:flex; align-items:flex-start; justify-content:center;}
  .nav-scan button{width:58px; height:58px; margin-top:-20px; border-radius:19px;
    background:linear-gradient(150deg,var(--accent),#3D6BE0); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    box-shadow:0 14px 28px -12px var(--accent); border:3px solid var(--bg); transition:transform .12s;}
  .nav-scan svg{width:21px; height:21px; stroke:#fff; fill:none; stroke-width:1.9;}
  .nav-scan button:active{transform:scale(.92);}
  .side-nav{display:none;}
  @media (min-width:900px){
    .side-nav{display:flex; gap:6px; align-items:center; padding:0 30px 16px; border-bottom:1px solid var(--line);}
    .side-nav button{padding:9px 14px; border-radius:10px; font-size:13.5px; font-weight:600; color:var(--muted); transition:background .15s, color .15s;}
    .side-nav button:hover{background:var(--surface); color:var(--text);}
    .side-nav button.active{background:var(--surface-2); color:var(--text);}
    .side-nav .scan-desktop{margin-left:auto; background:linear-gradient(150deg,var(--accent),#3D6BE0); color:#fff;}
  }

  .filter-bar{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px; scrollbar-width:none;}
  .filter-bar::-webkit-scrollbar{display:none;}
  .filter-bar select{padding:9px 11px; border:1px solid var(--line-2); border-radius:10px; background:var(--surface);
    color:var(--text); font-size:13px; white-space:nowrap; flex:none;}
  .filter-bar select:focus{outline:none; border-color:var(--accent);}

  /* ---------- Bewegungen ---------- */
  .movement-row{display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); align-items:flex-start;}
  .movement-row:last-child{border-bottom:none;}
  .mv-icon{width:32px; height:32px; border-radius:10px; flex:0 0 32px; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono'; font-weight:700; font-size:14px;}
  .mv-out{background:var(--danger-bg); color:var(--danger);}
  .mv-in{background:var(--ok-bg); color:var(--ok);}
  .mv-fix{background:var(--surface-3); color:var(--muted);}
  .mv-main{flex:1; min-width:0;}
  .mv-title{font-size:14px; font-weight:600;}
  .mv-meta{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .mv-qty{font-weight:700; font-size:14px; white-space:nowrap;}
  .pending-pill{display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
    background:var(--warn-bg); color:var(--warn); padding:2px 6px; border-radius:5px; margin-left:7px; vertical-align:1px;}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:4px 16px;}

  .empty-state{text-align:center; padding:34px 22px; color:var(--muted);
    border:1px dashed var(--line-2); border-radius:var(--radius); background:var(--surface);}
  .empty-state .glyph{margin:0 auto 12px; width:44px; height:44px; border-radius:13px; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center;}
  .empty-state .glyph svg{width:21px; height:21px; stroke:var(--muted); fill:none; stroke-width:1.7;}
  .empty-state strong{display:block; color:var(--text); font-family:'Barlow Condensed'; font-size:17px; text-transform:uppercase; letter-spacing:.02em;}
  .empty-state p{font-size:13.5px; margin:5px 0 0; line-height:1.5;}

  .toast{position:fixed; left:18px; right:18px; bottom:calc(var(--nav-h) + var(--sb) + 16px);
    background:var(--surface-3); color:var(--text); padding:14px 15px; border-radius:13px; font-size:13.5px; font-weight:500;
    z-index:80; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow); border:1px solid var(--line-2);
    animation:slideUp .22s cubic-bezier(.2,.9,.3,1);}
  @keyframes slideUp{from{transform:translateY(16px); opacity:0;}}
  .toast .t{flex:1;}
  .toast button{border:1px solid var(--line-2); border-radius:9px; padding:7px 11px; color:var(--text);
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;}
  .toast.bad{background:#3A1B1F; border-color:rgba(255,92,100,.4); color:#FFD9DB;}
  @media (min-width:900px){ .toast{left:auto; right:30px; bottom:26px; max-width:400px;} }

  .qr-box{background:#fff; border-radius:var(--radius); padding:22px; text-align:center;}
  .qr-box img{width:190px; height:190px; image-rendering:pixelated;}
  .qr-box .mono{font-size:11px; color:#666; margin:10px 0 0; word-break:break-all;}

  .field{margin-bottom:14px;}
  .field-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.09em;
    color:var(--muted); display:block; margin-bottom:7px;}
  .kicker-input, .field input, .field select, .field textarea{width:100%; padding:12px 13px;
    border:1px solid var(--line-2); border-radius:11px; font-size:16px; background:var(--surface-2); color:var(--text);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
  .field input::placeholder, .field textarea::placeholder{color:#68727F;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .hint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5;}

  /* ---------- Bottom-Sheet ---------- */
  #sheet-layer{position:fixed; inset:0; z-index:60; pointer-events:none;}
  #sheet-layer.open{pointer-events:auto;}
  #sheet-layer .backdrop{position:absolute; inset:0; background:rgba(5,7,10,.66); opacity:0; transition:opacity .22s; backdrop-filter:blur(2px);}
  #sheet-layer.open .backdrop{opacity:1;}
  .sheet{position:absolute; left:0; right:0; bottom:0; max-height:92%; overflow:auto;
    background:var(--surface); border-top:1px solid var(--line-2); border-radius:22px 22px 0 0;
    padding:8px 18px calc(22px + var(--sb)); transform:translateY(102%);
    transition:transform .28s cubic-bezier(.2,.9,.28,1); max-width:560px; margin:0 auto; box-shadow:var(--shadow);}
  #sheet-layer.open .sheet{transform:translateY(0);}
  .sheet.tall{height:100%; max-height:100%; border-radius:0; padding-top:calc(env(safe-area-inset-top,0px) + 12px);}
  .grip{width:38px; height:4px; border-radius:2px; background:var(--line-2); margin:5px auto 16px;}
  .sheet h2{font-size:22px; margin:0 0 5px;}
  .sheet .sub{color:var(--muted); font-size:13px; margin:0 0 18px; line-height:1.5;}
  .sheet-head{display:flex; align-items:flex-start; gap:12px;}
  .sheet-head .grow{flex:1; min-width:0;}

  .stepper{display:flex; align-items:center; justify-content:center; gap:16px; margin:10px 0 14px;}
  .stepper button{width:58px; height:58px; border-radius:17px; border:1px solid var(--line-2);
    background:var(--surface-2); font-size:26px; display:flex; align-items:center; justify-content:center; transition:background .15s, transform .09s;}
  .stepper button:hover{background:var(--surface-3);}
  .stepper button:active{transform:scale(.92);}
  .stepper .val{font-weight:700; font-size:42px; min-width:98px; text-align:center;}
  .quick-qty{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:18px;}
  .quick-qty button{padding:8px 15px; border-radius:10px; border:1px solid var(--line-2); background:var(--surface-2);
    font-family:'JetBrains Mono'; font-size:13px; transition:background .15s;}
  .quick-qty button:hover{background:var(--surface-3);}

  /* ---------- Kamera ---------- */
  .cam-wrap{position:relative; border-radius:16px; overflow:hidden; background:#05070A; aspect-ratio:1/1; margin-bottom:16px;}
  .cam-wrap video{width:100%; height:100%; object-fit:cover; display:block;}
  .reticle{position:absolute; inset:15%; pointer-events:none;}
  .reticle i{position:absolute; width:34px; height:34px; border:3px solid var(--accent);}
  .reticle i:nth-child(1){top:0; left:0; border-right:0; border-bottom:0; border-radius:5px 0 0 0;}
  .reticle i:nth-child(2){top:0; right:0; border-left:0; border-bottom:0; border-radius:0 5px 0 0;}
  .reticle i:nth-child(3){bottom:0; left:0; border-right:0; border-top:0; border-radius:0 0 0 5px;}
  .reticle i:nth-child(4){bottom:0; right:0; border-left:0; border-top:0; border-radius:0 0 5px 0;}
  .cam-note{position:absolute; left:0; right:0; bottom:12px; text-align:center; color:#fff; font-size:11px;
    font-weight:600; text-transform:uppercase; letter-spacing:.12em; text-shadow:0 1px 6px rgba(0,0,0,.9);}
  .torch{position:absolute; top:12px; right:12px; width:44px; height:44px; border-radius:13px;
    background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;}
  .torch svg{width:20px; height:20px; stroke:#fff; fill:none; stroke-width:1.8;}
  .torch[aria-pressed="true"]{background:var(--warn);}
  .torch[aria-pressed="true"] svg{stroke:#101418;}

  .banner{display:flex; gap:12px; align-items:center; background:var(--warn-bg); border:1px solid rgba(242,179,61,.35);
    color:var(--warn); border-radius:12px; padding:12px 14px; font-size:12.5px; font-weight:500; margin-bottom:16px; line-height:1.45;}
  .banner.ok{background:var(--ok-bg); border-color:rgba(53,208,138,.35); color:var(--ok);}
  .banner button{margin-left:auto; font-size:11.5px; font-weight:700; color:inherit; text-decoration:underline; white-space:nowrap;}

  .setup-card{background:var(--surface); border:1px solid rgba(242,179,61,.35); border-radius:var(--radius);
    padding:18px; margin-bottom:20px;}
  .setup-card h3{font-size:17px; color:var(--warn); margin-bottom:8px;}
  .setup-card p{font-size:13.5px; color:var(--muted); margin:0 0 14px; line-height:1.55;}

  .lbl-pick{display:flex; align-items:center; gap:13px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:11px; padding:12px 14px; margin-bottom:8px;}
  .lbl-pick input{width:21px; height:21px; flex:none; accent-color:var(--accent);}
  .lbl-pick .grow{flex:1; min-width:0; font-size:14px; font-weight:500;}

  .footer-note{text-align:center; font-size:11px; color:#5D6673; padding:20px 22px 12px;}

  /* ---------- Druck (immer hell) ---------- */
  #print-area{display:none;}
  .print-label{width:88mm; height:54mm; border:1px dashed #999; border-radius:3mm; padding:4mm; display:flex; gap:3mm;
    page-break-inside:avoid; break-inside:avoid; background:#fff; color:#000;}
  .print-label .pl-txt{flex:1; min-width:0; display:flex; flex-direction:column;}
  .print-label .pl-id{font-family:'Barlow Condensed'; font-weight:700; font-size:16pt; background:#000; color:#fff;
    padding:0 2mm; border-radius:1mm; align-self:flex-start; letter-spacing:.05em;}
  .print-label .pl-name{font-family:'Barlow Condensed'; font-weight:700; font-size:14pt; line-height:1.05;
    margin-top:1.5mm; text-transform:uppercase;}
  .print-label .pl-list{font-size:7pt; line-height:1.35; margin-top:1.5mm; flex:1; overflow:hidden; color:#333;}
  .print-label .pl-foot{font-size:6pt; letter-spacing:.06em; text-transform:uppercase; color:#666;}
  .print-label img{width:32mm; height:32mm; align-self:center;}
  @media print{
    @page{size:A4; margin:8mm;}
    html,body{background:#fff; color:#000;}
    #app,#sheet-layer,.toast{display:none !important;}
    #print-area{display:grid !important; grid-template-columns:88mm 88mm; gap:4mm; justify-content:center;}
  }
  .hide{display:none !important;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

  /* ================================================================
     Version 3.5 — Cockpit, Pegel, Ebenen
     ================================================================ */
  :root{
    --bg:#090B0F;
    --surface:#11141A;
    --surface-2:#171B23;
    --surface-3:#1F242E;
    --line:rgba(255,255,255,.055);
    --line-2:rgba(255,255,255,.10);
    --text:#E9EDF3;
    --muted:#8C96A5;
    --accent:#4E9BFF;
    --accent-2:#7FB8FF;
    --accent-soft:rgba(78,155,255,.12);
    --ok:#3ECF8E;   --ok-bg:rgba(62,207,142,.12);
    --warn:#F0B429; --warn-bg:rgba(240,180,41,.12);
    --crit:#FF5A5F; --crit-bg:rgba(255,90,95,.12);
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 10px 30px -16px rgba(0,0,0,.85);
  }
  /* Statusfarben zentral */
  .lv-ok{--c:var(--ok); --cbg:var(--ok-bg);}
  .lv-warn{--c:var(--warn); --cbg:var(--warn-bg);}
  .lv-crit{--c:var(--crit); --cbg:var(--crit-bg);}
  .lv-idle{--c:var(--muted); --cbg:var(--surface-3);}

  .dot{width:7px; height:7px; border-radius:50%; background:var(--c,var(--muted)); display:inline-block; flex:none;}
  .tag{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; padding:4px 9px;
       border-radius:7px; background:var(--cbg,var(--surface-3)); color:var(--c,var(--muted)); letter-spacing:.01em;}

  /* ---- Karten ohne harte Rahmen ---- */
  .stat-card, .cable-row, .crate-card, .panel, .empty-state, .quick-btn, .refill-card, .crit-card, .box-head, .detail-stock{
    border:none; background:var(--surface); box-shadow:var(--shadow-1);
  }
  .cable-row, .crate-card, .refill-card, .crit-card{position:relative; overflow:hidden;}
  .cable-row::before, .refill-card::before, .crit-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c,transparent); opacity:.9;
  }
  .cable-row.lv-ok::before{opacity:0;}
  .crate-card::after{display:none;}

  /* ---- Fahrzeugstatus ---- */
  .hero{background:linear-gradient(160deg,var(--surface-2),var(--surface)); border-radius:20px;
        padding:20px; margin-bottom:14px; box-shadow:var(--shadow-2); position:relative; overflow:hidden;}
  .hero::after{content:""; position:absolute; inset:0; border-radius:20px; pointer-events:none;
        background:radial-gradient(120% 90% at 100% 0%, var(--cbg) 0%, transparent 58%);}
  .hero-top{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .hero-main{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:14px 0 16px;}
  .hero-pct{display:flex; align-items:baseline; gap:8px;}
  .hero-pct span{font-family:'JetBrains Mono'; font-weight:700; font-size:52px; line-height:.9; letter-spacing:-.02em;}
  .hero-pct small{font-size:13px; color:var(--muted); font-weight:500;}
  .hero-ring{width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center;
    background:conic-gradient(var(--c) calc(var(--pct)*1%), var(--surface-3) 0);}
  .hero-ring span{width:34px; height:34px; border-radius:50%; background:var(--surface); display:grid; place-items:center;}
  .hero-bar{display:flex; gap:3px; height:6px; border-radius:3px; overflow:hidden; margin-bottom:12px;}
  .hero-bar i{background:var(--c); border-radius:2px; transition:flex .4s ease;}
  .hero-sub{font-size:12.5px; color:var(--muted); margin:0; line-height:1.5;}

  .live-pill{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600;
    padding:5px 10px; border-radius:999px; background:var(--cbg,var(--surface-3)); color:var(--c,var(--muted));}

  /* ---- Handlungsbedarf ---- */
  .action-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .action{background:var(--surface); border-radius:14px; padding:14px 12px; text-align:left;
    display:flex; flex-direction:column; gap:5px; box-shadow:var(--shadow-1); transition:transform .12s, background .15s;}
  .action:active{transform:scale(.97);}
  .action:hover{background:var(--surface-2);}
  .action .n{font-family:'JetBrains Mono'; font-weight:700; font-size:26px; line-height:1; color:var(--c,var(--text));}
  .action .l{font-size:11px; color:var(--muted); font-weight:500;}

  /* ---- Kritische Positionen ---- */
  .crit-card{display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    border-radius:14px; padding:14px 15px 14px 17px; margin-bottom:9px; transition:transform .12s, background .15s;}
  .crit-card:active{transform:scale(.995);}
  .crit-card:hover{background:var(--surface-2);}
  .crit-main{flex:1; min-width:0;}
  .crit-name{display:block; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .crit-meta{display:block; font-size:11.5px; color:var(--muted); margin-top:4px;}
  .crit-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none;}
  .crit-num{font-family:'JetBrains Mono'; font-weight:700; font-size:19px; color:var(--c); line-height:1;}
  .crit-num small{font-size:12px; color:var(--muted); font-weight:400;}

  .ok-state .glyph{background:var(--ok-bg) !important;}
  .ok-state .glyph svg{stroke:var(--ok) !important;}
  .ok-state{animation:okIn .4s cubic-bezier(.2,.9,.3,1);}
  @keyframes okIn{from{opacity:0; transform:scale(.97);}}

  /* ---- Heute / häufig ---- */
  .today{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; background:var(--surface);
    border-radius:14px; padding:15px; box-shadow:var(--shadow-1);}
  .today div{display:flex; flex-direction:column; gap:4px;}
  .today .n{font-family:'JetBrains Mono'; font-weight:700; font-size:22px; line-height:1;}
  .today .l{font-size:11px; color:var(--muted);}
  .tagline{display:flex; flex-wrap:wrap; gap:8px;}
  .usebtn{background:var(--surface); border-radius:10px; padding:9px 12px; font-size:12.5px; font-weight:500;
    display:inline-flex; align-items:center; gap:8px; box-shadow:var(--shadow-1); transition:background .15s;}
  .usebtn:hover{background:var(--surface-2);}
  .usebtn span{font-family:'JetBrains Mono'; font-size:11px; color:var(--muted);}

  /* ---- Pegelanzeige ---- */
  .level{display:flex; gap:2.5px; align-items:flex-end;}
  .level i{width:6px; height:11px; border-radius:1.5px; background:rgba(255,255,255,.09); display:block; transition:background .25s;}
  .level i.on{background:var(--c,var(--ok));}
  .level i.mark{box-shadow:inset 0 -2px 0 0 rgba(255,255,255,.55);}
  .stock-badge{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none;}
  .stock-num{font-family:'JetBrains Mono'; font-size:15px; font-weight:700; line-height:1; color:var(--c,var(--text));}
  .stock-num span{font-size:11px; color:var(--muted); font-weight:400; margin-left:3px;}
  .cable-row.lv-ok .stock-num{color:var(--text);}

  /* ---- Kistenkarte ---- */
  .crate-card{border-radius:16px; padding:15px 16px 15px 18px;}
  .crate-top{display:flex; align-items:center; gap:9px; justify-content:space-between;}
  .crate-bar{display:flex; gap:3px; height:4px; border-radius:2px; overflow:hidden; margin-top:11px;}
  .crate-bar i{background:var(--c); border-radius:2px;}
  .box-head{border-radius:18px; padding:17px; margin-bottom:16px;}

  /* ---- Kategorienavigation ---- */
  .cat-nav{display:flex; gap:8px; overflow-x:auto; padding:2px 0 8px; margin-bottom:8px; scrollbar-width:none;}
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-nav button{flex:none; padding:8px 14px; border-radius:10px; background:var(--surface); color:var(--muted);
    font-size:12.5px; font-weight:600; white-space:nowrap; transition:background .15s, color .15s;}
  .cat-nav button.on{background:var(--accent); color:#fff;}

  /* ---- Nachfüllen ---- */
  .refill-head{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; background:var(--surface);
    border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow-1);}
  .refill-head div{display:flex; flex-direction:column; gap:4px;}
  .refill-head .n{font-family:'JetBrains Mono'; font-weight:700; font-size:23px; line-height:1;}
  .refill-head .n.lv-crit{color:var(--crit);} .refill-head .n.lv-warn{color:var(--warn);}
  .refill-head .l{font-size:10.5px; color:var(--muted);}
  .seg-switch{display:flex; gap:4px; background:var(--surface); border-radius:12px; padding:4px; margin-bottom:14px;}
  .seg-switch button{flex:1; padding:9px; border-radius:9px; font-size:12.5px; font-weight:600; color:var(--muted); transition:background .18s, color .18s;}
  .seg-switch button.on{background:var(--surface-3); color:var(--text);}
  .refill-card{display:flex; align-items:center; gap:12px; border-radius:14px; padding:14px 14px 14px 17px; margin-bottom:9px;}
  .rc-main{flex:1; min-width:0; text-align:left;}
  .rc-name{display:block; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rc-where{display:block; font-size:11.5px; color:var(--muted); margin-top:3px;}
  .rc-values{display:flex; gap:16px; margin-top:10px;}
  .rc-values span{display:flex; flex-direction:column; font-size:10px; color:var(--muted); gap:2px;}
  .rc-values b{font-family:'JetBrains Mono'; font-size:15px; color:var(--text); font-weight:700;}
  .rc-add{flex:none; min-width:58px; height:48px; border-radius:13px; background:var(--cbg); color:var(--c);
    font-family:'JetBrains Mono'; font-weight:700; font-size:15px; transition:transform .1s, background .15s;}
  .rc-add:hover{background:var(--c); color:#0B0E12;}
  .rc-add:active{transform:scale(.92);}
  .group{margin-bottom:12px;}
  .group-head{display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:13px 15px;
    background:var(--surface-2); border-radius:13px; margin-bottom:9px;}
  .group-name{font-weight:600; font-size:14.5px;}
  .group-meta{margin-left:auto; font-size:11.5px; color:var(--muted);}
  .group-arrow{display:flex; transition:transform .22s;}
  .group-arrow svg{width:17px; height:17px; stroke:var(--muted); fill:none; stroke-width:2;}
  .group-arrow.open{transform:rotate(180deg);}

  /* ---- Materialdetail ---- */
  .detail-stock{border-radius:18px; padding:18px;}
  .ds-top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;}
  .ds-num{font-family:'JetBrains Mono'; font-weight:700; font-size:40px; line-height:1; color:var(--c);}
  .ds-num small{font-size:18px; color:var(--muted); font-weight:400; margin-left:5px;}
  .ds-track{position:relative; height:10px; border-radius:5px; background:rgba(255,255,255,.07); overflow:visible;}
  .ds-fill{position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:var(--c); transition:width .45s cubic-bezier(.2,.9,.3,1);}
  .ds-mark{position:absolute; top:-4px; bottom:-4px; width:2px; background:rgba(255,255,255,.65); border-radius:1px;}
  .ds-legend{display:flex; justify-content:space-between; margin-top:12px; font-size:11.5px; color:var(--muted);}
  .ds-legend b{font-family:'JetBrains Mono'; color:var(--text); margin-left:5px;}

  /* ---- Buchungs-Rückmeldung ---- */
  @keyframes flashRow{0%{background:var(--accent-soft);} 100%{background:var(--surface);}}
  .cable-row.flash, .refill-card.flash{animation:flashRow .7s ease;}

  /* ---- Desktop-Cockpit ---- */
  .cockpit{display:block;}
  @media (min-width:980px){
    .cockpit{display:grid; grid-template-columns:1.05fr 1.15fr .9fr; gap:24px; align-items:start;}
    .cockpit .subhead:first-child{margin-top:0;}
    .hero{margin-bottom:16px;}
  }
  @media (min-width:980px){
    .refill-card{padding:16px 16px 16px 19px;}
  }
  .cable-row{border-radius:14px;}
  .quick-btn{border-radius:14px;}
  .stat-card{border-radius:14px;}
  .empty-state{border:1px dashed var(--line-2);}
  .filter-bar select{background:var(--surface); border-color:transparent;}
  .search-input{border-color:transparent; background:var(--surface);}
  .search-input:focus{border-color:var(--accent); background:var(--surface-2);}
  .icon-btn{border-color:transparent; background:var(--surface);}
  .btn-outline{border-color:transparent; background:var(--surface-2);}
  .take-btn{border-color:transparent;}


  /* ---- Artikelbild ---- */
  .img-block{display:flex; align-items:center; gap:14px; background:var(--surface); border-radius:16px;
    padding:12px; margin-bottom:14px; box-shadow:var(--shadow-1);}
  .img-thumb{width:82px; height:82px; flex:none; border-radius:12px; overflow:hidden; background:var(--surface-3);
    padding:0; transition:transform .12s;}
  .img-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .img-thumb:active{transform:scale(.96);}
  .img-actions{display:flex; flex-direction:column; gap:8px; flex:1;}
  .img-actions .btn{width:100%;}
  .img-add{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px;
    border:1px dashed var(--line-2); border-radius:16px; color:var(--muted); font-size:13.5px; font-weight:600;
    margin-bottom:14px; transition:background .15s, color .15s;}
  .img-add svg{width:19px; height:19px; stroke:currentColor; fill:none;}
  .img-add:hover{background:var(--surface); color:var(--text);}
  .img-busy{display:flex; align-items:center; gap:12px; padding:16px; font-size:13.5px; color:var(--muted);}
  .spinner{width:17px; height:17px; border-radius:50%; border:2px solid var(--line-2);
    border-top-color:var(--accent); animation:spin .7s linear infinite; flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .row-thumb{width:38px; height:38px; flex:none; border-radius:9px; object-fit:cover; background:var(--surface-3);}

  #lightbox{position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; padding:24px; background:rgba(5,7,10,.9); backdrop-filter:blur(6px);}
  #lightbox.open{display:flex; animation:fade .2s ease;}
  #lightbox img{max-width:100%; max-height:78vh; border-radius:14px; object-fit:contain; box-shadow:var(--shadow-2);}
  #lightbox p{margin:0; font-size:13.5px; color:var(--muted); text-align:center;}
  .lb-close{position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); right:16px; width:42px; height:42px;
    border-radius:13px; background:var(--surface-2); display:flex; align-items:center; justify-content:center;}
  .lb-close svg{width:19px; height:19px; stroke:var(--text); fill:none;}

</style>
</head>

    return String(v==null?"":v).toLowerCase()
      .replace(/[äàâ]/g,"a").replace(/[öô]/g,"o").replace(/[üû]/g,"u").replace(/ß/g,"ss")
      .replace(/[^a-z0-9]+/g,"");
  }
  function relTime(ts){
    if(!ts) return "";
    const s = Math.round((Date.now()-ts)/1000);
    if(s < 60) return "gerade eben";
    if(s < 3600) return "vor " + Math.floor(s/60) + " Min.";
    if(s < 86400) return "vor " + Math.floor(s/3600) + " Std.";
    return new Date(ts).toLocaleDateString("de-CH");
  }

  /* Vorschlag für den Mindestbestand, abgeleitet vom Sollbestand.
     Nur ein Vorschlag – der Benutzer kann ihn jederzeit überschreiben. */
  function suggestMin(target){
    const t = toInt(target,1);
    if(t <= 1) return 1;
    if(t === 2) return 2;
    if(t <= 4) return 2;
    if(t <= 8) return 3;
    if(t <= 15) return 4;
    return 5;
  }

  /* Aus den obigen Definitionen wird einmalig der Katalog in Firebase
     erzeugt. Die Artikel-IDs (c001, c002 …) bleiben dabei exakt gleich,
     damit alle bisherigen Bewegungen weiterhin passen. */
  function buildSeed(){
    const boxes = {}, items = {}; let counter = 1;
    const pad = n => String(n).padStart(3,"0");
    BOX_DEFS.forEach((b,bi)=>{
      boxes[b.id] = { name:b.name, description:b.description, sort:bi };
      b.groups.forEach(g=>{
        g.items.forEach(([label, qty])=>{
          const id = "c"+pad(counter++);
          items[id] = { name:label, category:g.category, boxId:b.id, initialStock:qty, minStock:suggestMin(qty), targetStock:qty, unit:"Stk.", sort:counter };
        });
      });
    });
    return { boxes, items };
  }

  const boxById  = id => state.boxes.find(b=>b.id===id);
  const itemById = id => state.items.find(i=>i.id===id);
  const itemsOfBox = boxId => state.items.filter(i=>i.boxId===boxId).sort(bySort);
  function allCategories(){ return Array.from(new Set(state.items.map(i=>i.category))).sort((a,b)=>a.localeCompare(b,"de")); }
  function categoriesOfBox(boxId){ return Array.from(new Set(itemsOfBox(boxId).map(i=>i.category))); }

  /* ---------- Bestand: Startbestand + alle Bewegungen ---------- */
  function movementDelta(m){
    const q = Math.abs(toInt(m.qty,0));
    if(m.type === "entnahme") return -q;
    if(m.type === "korrektur") return toInt(m.qty,0);   // darf negativ sein
    return q;                                            // rueckgabe / auffuellung
  }
  function effectiveMovements(){
    const real = state.movements.filter(m => m.cableId !== PROBE_ID);
    const pending = state.outbox
      .filter(m => !state.movements.some(x => sameMove(x, m)))
      .map(m => Object.assign({pending:true}, m));
    return pending.concat(real);
  }
  let _deltaCache = null;
  function deltaMap(){
    if(_deltaCache) return _deltaCache;
    const map = Object.create(null);
    effectiveMovements().forEach(m=>{
      if(!m.cableId) return;
      map[m.cableId] = (map[m.cableId]||0) + movementDelta(m);
    });
    return (_deltaCache = map);
  }
  function invalidate(){ _deltaCache = null; }
  function currentStock(itemId){
    const it = itemById(itemId);
    if(!it) return 0;
    return toInt(it.initialStock,0) + (deltaMap()[itemId] || 0);
  }
  /* ----------------------------------------------------------------
     Drei Werte pro Material, klar getrennt:
       stock   – was jetzt im Fahrzeug liegt
       min     – ab wann gewarnt wird
       target  – wie viel im vollen Fahrzeug liegen soll
     Bewertet wird immer relativ, nie an der absoluten Stückzahl.
     ---------------------------------------------------------------- */
  function minOf(it){ return Math.max(1, toInt(it.minStock, 1)); }
  function targetOf(it){
    const t = toInt(it.targetStock, 0);
    if(t > 0) return t;
    return Math.max(toInt(it.initialStock, 0), minOf(it));
  }
  function statusOf(it){
    const stock = currentStock(it.id);
    const min = minOf(it), target = Math.max(targetOf(it), min);
    const level = stock <= 0 ? "crit" : (stock < min ? "warn" : "ok");
    return { stock, min, target, level, need: Math.max(0, target - stock),
             label: level==="ok" ? (stock>=target ? "Vollständig" : "In Ordnung")
                  : (level==="warn" ? "Kritisch" : "Leer") };
  }
  function isLow(it){ const st = statusOf(it); return st.level !== "ok"; }
  function stockStatus(it){ return statusOf(it); }   // Kompatibilität

  function lowItems(){
    return state.items
      .map(i => Object.assign({item:i}, statusOf(i)))
      .filter(x => x.level !== "ok")
      .sort((a,b) => {
        if(a.level !== b.level) return a.level === "crit" ? -1 : 1;
        const da = a.min > 0 ? a.stock/a.min : 1, db = b.min > 0 ? b.stock/b.min : 1;
        return da - db || b.need - a.need;
      });
  }
  function readiness(){
    const total = state.items.length;
    if(!total) return {pct:100, ok:0, warn:0, crit:0, total:0, need:0};
    let ok=0, warn=0, crit=0, need=0;
    state.items.forEach(i=>{
      const st = statusOf(i);
      if(st.level==="ok") ok++; else if(st.level==="warn") warn++; else crit++;
      need += st.need;
    });
    return {pct: Math.round(ok/total*100), ok, warn, crit, total, need};
  }

  /* ================================================================
     Firebase-Anbindung
     ================================================================ */
  async function initFirebase(){
    firebaseApp = initializeApp(firebaseConfig);
    db = getDatabase(firebaseApp);
    auth = getAuth(firebaseApp);
    try{
      storage = getStorage(firebaseApp);
      // Standard sind bis zu 10 Minuten stille Wiederholversuche – viel zu lang.
      storage.maxUploadRetryTime = 20000;
      storage.maxOperationRetryTime = 15000;
    }catch(e){ storage = null; console.warn("Storage nicht verfügbar", e); }

    // Anmeldung darf scheitern, ohne dass die ganze App stehen bleibt.
    try{
      await signInAnonymously(auth);
      state.authOk = true; state.authError = "";
    }catch(e){
      state.authOk = false;
      state.authError = e.code || e.message || String(e);
      console.warn("Anmeldung fehlgeschlagen", e);
    }
    state.firebaseReady = true;

    onValue(ref(db, ".info/connected"), snap=>{
      state.online = snap.val() === true;
      state.connKnown = true;
      if(state.online) flushOutbox();
      if(state.ready) render();
    });

    try{
      await ensureCatalog();
    }catch(e){
      onCatalogError(e);
    }

    onValue(ref(db, DB_ROOT + "/catalog/boxes"), snap=>{
      const val = snap.val();
      if(val){ state.boxes = toArr(val).sort(bySort); state.catalogFromCache = false; state.catalogDenied = false; cacheCatalog(); }
      if(state.ready) render();
    }, onCatalogError);

    onValue(ref(db, DB_ROOT + "/catalog/items"), snap=>{
      const val = snap.val();
      if(val){ state.items = toArr(val); state.catalogFromCache = false; state.catalogDenied = false; cacheCatalog(); }
      if(state.ready) render();
    }, onCatalogError);

    onValue(ref(db, DB_ROOT + "/movements"), snap=>{
      const raw = snap.val() || {};
      state.movements = Object.entries(raw).map(([id,v])=> Object.assign({id}, v))
        .sort((a,b)=> (b.serverTs||b.ts||0) - (a.serverTs||a.ts||0));
      invalidate();
      localSet("cache:movements", state.movements.slice(0,600));
      if(state.ready) render();
    }, onDbError);
  }
  /* Der Katalog liegt auf einem neuen Pfad. Sperren ihn die Regeln, arbeitet die
     App mit der eingebauten Liste weiter – Buchen bleibt davon unberührt. */
  function onCatalogError(error){
    console.warn("Katalog nicht verfügbar", error);
    state.catalogDenied = true;
    if(state.ready) render();
  }
  function onDbError(error){
    console.error("Firebase", error);
    state.error = error.message || String(error);
    state.errorCode = error.code || (/permission_denied/i.test(state.error) ? "PERMISSION_DENIED" : "");
    if(state.ready) render();
  }

  /* Firebase-Codes in verständliche Sätze übersetzen */
  function fbHint(code, msg){
    const c = String(code || "").toLowerCase() + " " + String(msg || "").toLowerCase();
    if(c.indexOf("permission_denied") >= 0 || c.indexOf("permission-denied") >= 0)
      return "Die Regeln der Datenbank lassen keinen Zugriff zu. Wichtig: Die Regeln müssen bei Build → Realtime Database → Reiter Regeln stehen, nicht bei Firestore Database. Dort den kompletten Inhalt ersetzen und auf Veröffentlichen klicken. Die passenden Regeln stehen unten zum Kopieren bereit.";
    if(c.indexOf("operation-not-allowed") >= 0 || c.indexOf("configuration-not-found") >= 0)
      return "Die anonyme Anmeldung ist nicht eingeschaltet. Firebase-Konsole → Build → Authentication → Sign-in method → Anonym → aktivieren.";
    if(c.indexOf("api-key") >= 0 || c.indexOf("invalid-api-key") >= 0)
      return "Der Firebase-Schlüssel stimmt nicht oder ist für diese Adresse gesperrt. In der Google-Cloud-Konsole unter APIs & Dienste → Anmeldedaten die Einschränkung des Web-API-Schlüssels prüfen.";
    if(c.indexOf("network") >= 0 || c.indexOf("unavailable") >= 0)
      return "Keine Verbindung zum Server. Internet prüfen – Entnahmen werden solange auf dem Gerät gesammelt.";
    if(c.indexOf("unauthorized-domain") >= 0)
      return "Diese Adresse ist in Firebase nicht freigegeben. Authentication → Settings → Autorisierte Domains → Domain hinzufügen.";
    return "";
  }

  async function ensureCatalog(){
    const snap = await get(ref(db, DB_ROOT + "/catalog/boxes"));
    const val = snap.val();
    if(val && Object.keys(val).length) return false;
    await set(ref(db, DB_ROOT + "/catalog"), Object.assign(buildSeed(), {seededAt: Date.now()}));
    return true;
  }
  function cacheCatalog(){ localSet("cache:catalog", {boxes: state.boxes, items: state.items}); }

  function loadFromCache(){
    const cached = localGet("cache:catalog");
    if(cached && cached.boxes && cached.boxes.length){
      state.boxes = cached.boxes; state.items = cached.items || [];
    }else{
      const seed = buildSeed();
      state.boxes = toArr(seed.boxes).sort(bySort);
      state.items = toArr(seed.items);
    }
    state.movements = localGet("cache:movements") || [];
    state.outbox = localGet("outbox") || [];
    invalidate();
  }

  /* ================================================================
     Buchungen — mit Warteschlange für Funklöcher
     ================================================================ */
  let flushing = false;
  function saveOutbox(){ localSet("outbox", state.outbox); }
  function dropSentOutbox(){
    const before = state.outbox.length;
    state.outbox = state.outbox.filter(m => !state.movements.some(x => sameMove(x, m)));
    if(state.outbox.length !== before){ saveOutbox(); invalidate(); }
  }
  /* Genau das Format, das die Datenbank seit jeher kennt – acht Felder,
     zwei Buchungsarten. Alles Weitere wird aus dem Katalog hergeleitet. */
  function wireFormat(m){
    return {
      cableId: m.cableId,
      type: m.type,
      qty: m.qty,
      user: m.user || "",
      date: m.date,
      time: m.time,
      ts: m.ts,
      serverTs: serverTimestamp()
    };
  }
  function sameMove(a, b){
    return a && b && a.cableId === b.cableId && a.ts === b.ts && a.qty === b.qty && a.type === b.type;
  }
  function bookMovement(itemId, type, qty){
    const it = itemById(itemId); if(!it) return;
    const now = new Date();
    const val = {
      cableId: itemId,
      type: (type === "entnahme") ? "entnahme" : "rueckgabe",
      qty: Math.abs(toInt(qty,0)),
      user: state.user || "",
      date: now.toLocaleDateString("de-CH"),
      time: now.toLocaleTimeString("de-CH", {hour:"2-digit", minute:"2-digit"}),
      ts: Date.now()
    };
    state.outbox.push(val);
    saveOutbox(); invalidate();
    flushOutbox();
    return val;
  }
  async function flushOutbox(){
    if(flushing || !db || !state.firebaseReady || !state.outbox.length) return;
    flushing = true;
    try{
      while(state.outbox.length){
        const m = state.outbox[0];
        // Nach einem Neustart könnte die Buchung bereits drüben sein.
        if(state.movements.some(x => sameMove(x, m))){
          state.outbox.shift(); saveOutbox(); invalidate(); continue;
        }
        await push(ref(db, DB_ROOT + "/movements"), wireFormat(m));
        // Erst jetzt – nach der Bestätigung vom Server – aus der Warteschlange nehmen.
        state.outbox = state.outbox.filter(x => !sameMove(x, m));
        state.sendError = "";
        saveOutbox(); invalidate();
      }
    }catch(e){
      const code = e.code || e.message || String(e);
      state.sendError = code;
      state.errorCode = code;
      console.warn("Buchung abgelehnt", e);
      toast("Buchung nicht gespeichert: " + code, "bad");
    }finally{
      flushing = false;
      if(state.ready) render();
    }
  }
  async function undoMovement(mv){
    // Wartende Buchung: einfach aus der Warteschlange nehmen.
    if(state.outbox.some(m => sameMove(m, mv))){
      state.outbox = state.outbox.filter(m => !sameMove(m, mv));
      saveOutbox(); invalidate(); render();
      return;
    }
    const rec = state.movements.find(m => sameMove(m, mv)) || state.movements.find(m=>m.id===mv.id);
    if(rec && rec.id && db && state.firebaseReady){
      await remove(ref(db, DB_ROOT + "/movements/" + rec.id));
    }
  }

  /* ================================================================
     Katalog bearbeiten (Kisten und Material)
     ================================================================ */
  function requireLive(){
    if(!db || !state.firebaseReady){
      toast("Dafür braucht es eine Verbindung. Entnahmen gehen auch offline.", "bad");
      return false;
    }
    if(state.catalogDenied){
      toast("Die Datenbankregeln geben den Katalog noch nicht frei – Einstellungen → Verbindung prüfen.", "bad");
      return false;
    }
    return true;
  }
  async function saveItem(boxId, itemId, data){
    if(!requireLive()) return;
    if(itemId){
      await update(ref(db, DB_ROOT + "/catalog/items/" + itemId), data);
    }else{
      const id = newId("x");
      const maxSort = Math.max(0, ...itemsOfBox(boxId).map(i=>toInt(i.sort,0)));
      await set(ref(db, DB_ROOT + "/catalog/items/" + id), Object.assign({boxId, sort:maxSort+1, unit:"Stk.", createdAt:Date.now()}, data));
      return id;
    }
  }
  async function deleteItem(itemId){
    if(!requireLive()) return;
    await bildLoeschen(itemId, true);   // verwaiste Datei im Storage vermeiden
    await remove(ref(db, DB_ROOT + "/catalog/items/" + itemId));
  }
  async function saveBox(boxId, data, isNew){
    if(!requireLive()) return;
    if(isNew){
      const maxSort = Math.max(0, ...state.boxes.map(b=>toInt(b.sort,0)));
      await set(ref(db, DB_ROOT + "/catalog/boxes/" + boxId), Object.assign({sort:maxSort+1, createdAt:Date.now()}, data));
      return boxId;
    }
    await update(ref(db, DB_ROOT + "/catalog/boxes/" + boxId), data);
    return boxId;
  }
  async function deleteBox(boxId){
    if(!requireLive()) return;
    for(const i of itemsOfBox(boxId)){
      if(i.image) { try{ await bildLoeschen(i.id, true); }catch(e){} }
    }
    const updates = {};
    itemsOfBox(boxId).forEach(i=>{ updates["catalog/items/" + i.id] = null; });
    updates["catalog/boxes/" + boxId] = null;
    await update(ref(db, DB_ROOT), updates);
  }

  /* ================================================================
     Artikelbild — genau ein Bild pro Artikel
     Storage-Pfad: service-material/articles/{artikelId}/image.jpg
     Referenz im Artikel: image = { path, url, name, updatedAt }
     ================================================================ */
  const BILD_TYPEN = ["image/jpeg","image/jpg","image/png","image/webp"];
  const BILD_MAX_MB = 8;
  const bildPfad = itemId => "service-material/articles/" + itemId + "/image.jpg";

  /* Vor dem Hochladen verkleinern – spart Datenvolumen im Fahrzeug. */
  function bildVerkleinern(file, maxKante){
    return new Promise((res, rej)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = ()=>{
        URL.revokeObjectURL(url);
        let {width:w, height:hh} = img;
        const f = Math.min(1, maxKante / Math.max(w, hh));
        w = Math.round(w * f); hh = Math.round(hh * f);
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = hh;
        cv.getContext("2d").drawImage(img, 0, 0, w, hh);
        cv.toBlob(b => b ? res(b) : rej(new Error("Bild konnte nicht verarbeitet werden")), "image/jpeg", 0.82);
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("Bild konnte nicht gelesen werden")); };
      img.src = url;
    });
  }

  function bildFehler(e){
    const code = String((e && e.code) || (e && e.message) || e).toLowerCase();
    if(code.indexOf("unauthorized") >= 0 || code.indexOf("permission") >= 0)
      return "Die Storage-Regeln lassen das Speichern nicht zu. Firebase-Konsole → Build → Storage → Reiter Regeln → Inhalt von storage.rules einsetzen und veröffentlichen.";
    if(code.indexOf("retry-limit") >= 0 || code.indexOf("zeitüber") >= 0 || code.indexOf("timeout") >= 0 || code.indexOf("unknown") >= 0)
      return "Der Speicher antwortet nicht. Sehr wahrscheinlich ist Firebase Storage noch nicht aktiviert: Konsole → Build → Storage → Jetzt starten. Danach die Regeln veröffentlichen.";
    if(code.indexOf("bucket-not-found") >= 0 || code.indexOf("project-not-found") >= 0)
      return "Der Speicherordner des Projekts existiert noch nicht. Konsole → Build → Storage → Jetzt starten.";
    if(code.indexOf("quota") >= 0) return "Das Speicherkontingent des Projekts ist erschöpft.";
    if(code.indexOf("network") >= 0 || code.indexOf("offline") >= 0) return "Keine Verbindung – Bild später nochmals hochladen.";
    return "";
  }

  function bildWaehlen(itemId){
    if(state.uploading) return;
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/jpeg,image/png,image/webp";
    inp.style.display = "none";
    inp.addEventListener("change", ()=>{
      const f = inp.files && inp.files[0];
      inp.remove();
      if(f) bildHochladen(itemId, f);
    });
    document.body.appendChild(inp);
    inp.click();
  }

  async function bildHochladen(itemId, file){
    const it = itemById(itemId);
    if(!it){ toast("Der Artikel existiert nicht mehr.","bad"); return; }
    if(BILD_TYPEN.indexOf(String(file.type).toLowerCase()) < 0){
      toast("Nur JPG, PNG oder WEBP möglich.","bad"); return;
    }
    if(file.size > BILD_MAX_MB * 1024 * 1024){
      toast("Das Bild ist grösser als " + BILD_MAX_MB + " MB.","bad"); return;
    }
    if(!storage){ toast("Firebase Storage ist nicht verfügbar.","bad"); return; }
    if(!requireLive()) return;
    if(state.uploading) return;

    state.uploading = itemId; state.imageError = ""; render();
    const altPfad = it.image && it.image.path;
    try{
      const blob = await withTimeout(bildVerkleinern(file, 1400), 20000);
      const pfad = bildPfad(itemId);
      const ziel = sRef(storage, pfad);
      await withTimeout(uploadBytes(ziel, blob, {contentType:"image/jpeg", cacheControl:"public,max-age=86400"}), 30000);
      const url = await withTimeout(getDownloadURL(ziel), 15000);

      if(!itemById(itemId)) throw new Error("Der Artikel wurde zwischenzeitlich gelöscht.");
      await withTimeout(update(ref(db, DB_ROOT + "/catalog/items/" + itemId), {
        image: { path: pfad, url: url, name: file.name || "image.jpg", updatedAt: Date.now() }
      }), 15000);

      // Ein anderer alter Pfad darf nicht liegen bleiben.
      if(altPfad && altPfad !== pfad){
        try{ await deleteObject(sRef(storage, altPfad)); }catch(e){}
      }
      if(navigator.vibrate) navigator.vibrate(16);
      toast("Bild gespeichert.");
    }catch(e){
      console.error("Bild-Upload", e);
      const hinweis = bildFehler(e) || ("Bild nicht gespeichert: " + (e.code || e.message || e));
      state.imageError = hinweis;
      toast(hinweis, "bad");
    }finally{
      state.uploading = null; render();
    }
  }

  async function bildLoeschen(itemId, still){
    const it = itemById(itemId);
    const bild = it && it.image;
    if(!bild) return;
    if(!still){
      if(!confirm("Bild von \"" + it.name + "\" wirklich löschen?")) return;
      if(!requireLive()) return;
      state.uploading = itemId; render();
    }
    try{
      if(storage && bild.path){
        try{ await withTimeout(deleteObject(sRef(storage, bild.path)), 15000); }
        catch(e){ if(String(e.code||"").indexOf("object-not-found") < 0) throw e; }
      }
      if(!still && db){
        await withTimeout(update(ref(db, DB_ROOT + "/catalog/items/" + itemId), { image: null }), 15000);
        toast("Bild gelöscht.");
      }
    }catch(e){
      console.error("Bild löschen", e);
      if(!still) toast(bildFehler(e) || ("Bild konnte nicht gelöscht werden: " + (e.code || e.message || e)), "bad");
    }finally{
      if(!still){ state.uploading = null; render(); }
    }
  }

  /* Pegelanzeige wie an einem Aussteuerungsmesser: die Segmente stehen
     für den Sollbestand, die Markierung für den Mindestbestand. */
  function meter(st, segsMax){
    const segs = Math.min(segsMax || 6, Math.max(2, st.target));
    const gefuellt = st.target > 0 ? Math.round(st.stock / st.target * segs) : 0;
    const on = st.stock > 0 ? Math.max(1, Math.min(segs, gefuellt)) : 0;
    const minSeg = st.target > 0 ? Math.max(1, Math.round(st.min / st.target * segs)) : 0;
    let bars = "";
    for(let i=0;i<segs;i++){
      const cls = (i < on ? "on" : "") + (i + 1 === minSeg ? " mark" : "");
      bars += `<i class="${cls}"></i>`;
    }
    return `<span class="level lv-${st.level}">${bars}</span>`;
  }

    return `<span class="stock-badge lv-${s2.level}">

      ${meter(s2)}
    </span>`;
  }

  function heuteZahlen(){
    const heute = new Date().toLocaleDateString("de-CH");
    const mv = effectiveMovements().filter(m => m.date === heute);
    return {
      raus: mv.filter(m=>m.type==="entnahme").reduce((a,m)=>a+Math.abs(toInt(m.qty,0)),0),
      rein: mv.filter(m=>m.type!=="entnahme").reduce((a,m)=>a+Math.abs(toInt(m.qty,0)),0),
      leute: new Set(mv.map(m=>m.user).filter(Boolean)).size
    };
  }
  function haeufig(){
    const grenze = Date.now() - 30*24*3600*1000;
    const zaehler = {};
    effectiveMovements().forEach(m=>{
      if(m.type !== "entnahme" || (m.ts||0) < grenze) return;
      zaehler[m.cableId] = (zaehler[m.cableId]||0) + Math.abs(toInt(m.qty,0));
    });
    return Object.entries(zaehler)
      .map(([id,n])=>({item:itemById(id), n}))
      .filter(x=>x.item)
      .sort((a,b)=>b.n-a.n)
      .slice(0,4);
  }
