    const r = readiness();
    const stufe = r.crit ? "crit" : (r.warn ? "warn" : "ok");
    return h`
      <section class="hero lv-${stufe}">
        <div class="hero-top">
          <span class="eyebrow" style="margin:0;">Servicefahrzeug</span>
          ${livePill()}
        </div>
        <div class="hero-main">
          <div class="hero-pct"><span>${r.pct}</span><small>% einsatzbereit</small></div>
          <div class="hero-ring" style="--pct:${r.pct}"><span>${statusDot(stufe)}</span></div>
        </div>
        <div class="hero-bar">
          <i style="flex:${r.ok||0.001}" class="lv-ok"></i>
          <i style="flex:${r.warn||0.001}" class="lv-warn"></i>
          <i style="flex:${r.crit||0.001}" class="lv-crit"></i>
        </div>
        <p class="hero-sub">${r.ok} von ${r.total} Positionen erfüllen ihren Mindestbestand${r.need?` · ${r.need} Stück fehlen`:""}</p>
      </section>`;
  }
  function livePill(){
    if(state.sendError || state.authError) return `<span class="live-pill lv-crit">${statusDot("crit")}Nicht verbunden</span>`;
    if(state.outbox.length) return `<span class="live-pill lv-warn">${statusDot("warn")}${state.outbox.length} warten</span>`;
    if(!state.connKnown) return `<span class="live-pill">${statusDot("idle")}Verbinde</span>`;
    if(!state.online) return `<span class="live-pill lv-warn">${statusDot("warn")}Offline</span>`;
    return `<span class="live-pill lv-ok">${statusDot("ok")}Live</span>`;
  }

  function renderDashboard(){
    const r = readiness();
    const low = lowItems();
    const t = heuteZahlen();
    const oft = haeufig();
    const recent = effectiveMovements().slice(0,4);
    return h`
      ${state.user ? "" : h`<div class="banner">Noch kein Name hinterlegt – dann sieht niemand, wer etwas entnommen hat.<button data-nav="settings">Eintragen</button></div>`}

      <div class="cockpit">
        <div class="col-a">
          ${heroCard()}

          <div class="action-row">
            <button class="action ${r.crit?"lv-crit":""}" data-act="filter-empty">
              <span class="n">${r.crit}</span><span class="l">Leer</span>
            </button>
            <button class="action ${r.warn?"lv-warn":""}" data-nav="refill">
              <span class="n">${r.warn}</span><span class="l">Kritisch</span>
            </button>
            <button class="action" data-nav="movements">
              <span class="n">${t.raus}</span><span class="l">Heute raus</span>
            </button>
          </div>

          <div class="quick-grid">
            <button class="quick-btn accent" data-act="scan">${ICONS.scan}Scannen</button>
            <button class="quick-btn" data-nav="cables">${ICONS.search}Suchen</button>
            <button class="quick-btn" data-nav="boxes">${ICONS.box}Kisten</button>
            <button class="quick-btn" data-nav="refill">${ICONS.undo}Nachfüllen</button>
            <button class="quick-btn" data-act="add-material">${ICONS.plus}Material</button>
            <button class="quick-btn" data-nav="movements">${ICONS.list}Verlauf</button>
          </div>
        </div>

        <div class="col-b">
          <div class="subhead"><h3>Kritisch für den nächsten Einsatz</h3>${low.length?`<button class="link-btn" data-nav="refill">Alle ${low.length}</button>`:""}</div>
          ${low.length ? low.slice(0,5).map(critRow).join("")
            : h`<div class="empty-state ok-state">
                  <div class="glyph lv-ok">${ICONS.check}</div>
                  <strong>Fahrzeug vollständig bereit</strong>
                  <p>Alle ${r.total} Positionen erfüllen ihren Mindestbestand.</p>
                </div>`}

          ${oft.length >= 3 ? h`
            <div class="subhead"><h3>Häufig verwendet</h3></div>
            <div class="tagline">
              ${oft.map(x=>`<button class="usebtn" data-act="open-item" data-id="${x.item.id}">${esc(x.item.name)}<span>${x.n}×</span></button>`).join("")}
            </div>` : ""}
        </div>

        <div class="col-c">
          <div class="subhead"><h3>Heute</h3></div>
          <div class="today">
            <div><span class="n">${t.raus}</span><span class="l">entnommen</span></div>
            <div><span class="n">${t.rein}</span><span class="l">zurück</span></div>
            <div><span class="n">${t.leute}</span><span class="l">Techniker</span></div>
          </div>
          <div class="subhead"><h3>Letzte Buchungen</h3><button class="link-btn" data-nav="movements">Alle</button></div>
          ${recent.length ? `<div class="panel">${recent.map(movementRow).join("")}</div>`
            : emptyState("list","Noch nichts gebucht","Sobald jemand scannt und entnimmt, steht es hier.")}
        </div>
      </div>`;
  }

  function critRow(x){
    const box = boxById(x.item.boxId);
    return h`
      <button class="crit-card lv-${x.level}" data-act="qty-sheet" data-id="${x.item.id}" data-mode="auffuellen" data-preset="${x.need}">
        <span class="crit-main">
          <span class="crit-name">${esc(x.item.name)}</span>
          <span class="crit-meta">${box?esc(String(box.id).toUpperCase())+" · "+esc(box.name):""}</span>
        </span>
        <span class="crit-right">
          <span class="crit-num">${x.stock}<small>/${x.target}</small></span>
          <span class="tag lv-${x.level}">${x.level==="crit"?"Leer":"+"+x.need+" nachfüllen"}</span>
        </span>
      </button>`;
  }

  function boxStat(boxId){
    const its = itemsOfBox(boxId);
    let ok=0, warn=0, crit=0;
    its.forEach(i=>{ const l = statusOf(i).level; if(l==="ok") ok++; else if(l==="warn") warn++; else crit++; });
    return {total:its.length, ok, warn, crit, level: crit?"crit":(warn?"warn":"ok")};
  }
  function renderBoxes(){
    const q = normalize(state.search);
    const boxes = state.boxes.filter(b=>{
      if(!q) return true;
      if(normalize(b.name+" "+(b.description||"")+" "+b.id).includes(q)) return true;
      return itemsOfBox(b.id).some(i=>normalize(i.name+" "+i.category).includes(q));
    });
    return h`
      <div class="eyebrow">Fahrzeug</div>
      <h2 class="section-title">Alle Materialkisten</h2>
      <p class="lead">Antippen für den Inhalt. Am schnellsten geht es über den QR-Code an der Kiste.</p>
      ${boxes.map(b=>{
        const st = boxStat(b.id);
        const treffer = q ? itemsOfBox(b.id).filter(i=>normalize(i.name).includes(q)) : [];
        return h`
        <button class="crate-card lv-${st.level}" data-act="open-box" data-id="${b.id}">
          <span class="crate-body">
            <span class="crate-top">
              <span class="crate-id">${esc(String(b.id).toUpperCase())}</span>
              <span class="tag lv-${st.level}">${statusDot(st.level)}${st.level==="ok" ? "Vollständig" : (st.crit? st.crit+" leer" : st.warn+" kritisch")}</span>
            </span>
            <h3>${esc(b.name)}${b.description?" — "+esc(b.description):""}</h3>
            <span class="crate-meta">${st.ok} / ${st.total} Positionen in Ordnung${treffer.length?" · Treffer: "+esc(treffer.slice(0,2).map(i=>i.name).join(", ")):""}</span>
            <span class="crate-bar">
              <i class="lv-ok" style="flex:${st.ok||0.001}"></i>
              <i class="lv-warn" style="flex:${st.warn||0.001}"></i>
              <i class="lv-crit" style="flex:${st.crit||0.001}"></i>
            </span>
          </span>
          <span class="crate-arrow">›</span>
        </button>`;}).join("") || emptyState("box","Keine Kiste gefunden","Andere Schreibweise versuchen.")}
      <button class="btn btn-outline" style="width:100%;margin-top:8px;" data-act="box-form">${ICONS.plus} Neue Kiste anlegen</button>`;
  }

  function renderBoxDetail(){
    const box = boxById(state.activeBoxId);
    if(!box) return emptyState("box","Kiste nicht gefunden","Sie wurde vielleicht gelöscht.");
    const q = normalize(state.search);
    const st = boxStat(box.id);
    let its = itemsOfBox(box.id);
    const alleKats = Array.from(new Set(its.map(i=>i.category)));
    if(state.boxCat && alleKats.includes(state.boxCat)) its = its.filter(i=>i.category===state.boxCat);
    if(q) its = its.filter(i=>normalize(i.name+" "+i.category+" "+(i.description||"")).includes(q));
    const picked = Object.keys(state.selection).filter(id => state.selection[id] > 0 && its.some(i=>i.id===id));
    const total = picked.reduce((a,id)=>a+state.selection[id],0);

    const groups = {};
    its.forEach(i=>{ (groups[i.category] = groups[i.category] || []).push(i); });
    const cats = Object.keys(groups);

    return h`
      <button class="btn btn-outline btn-sm" data-nav="boxes" style="margin-bottom:16px;">${ICONS.back} Alle Kisten</button>
      <div class="box-head lv-${st.level}">
        <div class="crate-top">
          <span class="crate-id">${esc(String(box.id).toUpperCase())}</span>
          <span class="tag lv-${st.level}">${statusDot(st.level)}${st.level==="ok"?"Vollständig":(st.crit?st.crit+" leer":st.warn+" kritisch")}</span>
        </div>
        <h2 class="section-title" style="margin:10px 0 4px;">${esc(box.name)}</h2>
        <p class="lead" style="margin:0 0 10px;">${box.description?esc(box.description)+" · ":""}${st.ok} von ${st.total} Positionen in Ordnung</p>
        <span class="crate-bar">
          <i class="lv-ok" style="flex:${st.ok||0.001}"></i>
          <i class="lv-warn" style="flex:${st.warn||0.001}"></i>
          <i class="lv-crit" style="flex:${st.crit||0.001}"></i>
        </span>
      </div>

      ${alleKats.length > 1 ? h`
        <div class="cat-nav">
          <button class="${state.boxCat?"":"on"}" data-act="box-cat" data-cat="">Alle</button>
          ${alleKats.map(c=>`<button class="${state.boxCat===c?"on":""}" data-act="box-cat" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
        </div>` : ""}

      ${cats.length ? cats.map(cat=>h`
        ${alleKats.length > 1 && !state.boxCat ? `<p class="field-label" style="margin-top:18px;">${esc(cat)}</p>` : ""}
        ${groups[cat].map(i=>itemRow(i, {pick:true, take:true})).join("")}
      `).join("") : emptyState("cable", q?"Nichts gefunden":"Kiste ist noch leer", q?"Suchbegriff anpassen.":"Unten das erste Material erfassen.")}

      <div class="btn-row" style="margin-top:16px;">
        <button class="btn btn-outline btn-sm" data-act="item-form" data-box="${box.id}">${ICONS.plus} Material</button>
        <button class="btn btn-outline btn-sm" data-act="show-qr" data-id="${box.id}">${ICONS.qr} QR-Code</button>
        <button class="btn btn-outline btn-sm" data-act="box-form" data-id="${box.id}">${ICONS.edit} Kiste</button>
      </div>

      ${picked.length ? h`
      <div class="sticky-cta">
        <button class="btn btn-primary" data-act="confirm-take">Entnahme buchen · ${total} Stück aus ${picked.length} Position(en)</button>
      </div>` : ""}`;
  }

  function renderItems(){
    const q = normalize(state.search);
    let its = state.items.slice();
    if(state.filters.category) its = its.filter(i=>i.category===state.filters.category);
    if(state.filters.box) its = its.filter(i=>i.boxId===state.filters.box);
    if(state.filters.status){
      its = its.filter(i=>{
        const st = statusOf(i);
        if(state.filters.status === "da") return st.level === "ok";
        if(state.filters.status === "niedrig") return st.level === "warn";
        if(state.filters.status === "leer") return st.level === "crit";
        return true;
      });
    }
    if(q) its = its.filter(i=>{
      const box = boxById(i.boxId);
      return normalize(i.name + " " + i.category + " " + (i.description||"") + " " +
                       (box ? box.name + " " + box.id : "")).includes(q);
    });
    const grouped = {};
    its.forEach(i=>{ (grouped[i.category] = grouped[i.category]||[]).push(i); });
    const cats = Object.keys(grouped).sort((a,b)=>a.localeCompare(b,"de"));
    return h`
      <div class="eyebrow">Bestand</div>
      <h2 class="section-title">Alles Material</h2>
      <div class="filter-bar">
        <select id="filterStatus">
          <option value="">Jeder Bestand</option>
          <option value="da" ${state.filters.status==="da"?"selected":""}>In Ordnung</option>
          <option value="niedrig" ${state.filters.status==="niedrig"?"selected":""}>Kritisch</option>
          <option value="leer" ${state.filters.status==="leer"?"selected":""}>Leer</option>
        </select>
        <select id="filterCategory">
          <option value="">Alle Kategorien</option>
          ${allCategories().map(c=>`<option value="${esc(c)}" ${state.filters.category===c?"selected":""}>${esc(c)}</option>`).join("")}
        </select>
        <select id="filterBox">
          <option value="">Alle Kisten</option>
          ${state.boxes.map(b=>`<option value="${b.id}" ${state.filters.box===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}
        </select>
      </div>
      <p class="lead" style="margin-top:-6px;">${its.length} von ${state.items.length} Materialtypen</p>
      ${cats.length ? cats.map(cat=>h`
        <p class="field-label" style="margin-top:14px;">${esc(cat)}</p>
        ${grouped[cat].sort(bySort).map(i=>itemRow(i,{showBox:true, take:true})).join("")}
      `).join("") : emptyState("search","Kein Material gefunden","Filter zurücksetzen oder anders suchen.")}`;
  }

  function renderItemDetail(){
    const it = itemById(state.activeItemId);
    if(!it) return emptyState("cable","Material nicht gefunden","Es wurde vielleicht gelöscht.");
    const box = boxById(it.boxId);
    const st = statusOf(it);
    const hist = effectiveMovements().filter(m=>m.cableId===it.id);
    const pct = Math.min(100, Math.round(st.stock / Math.max(1, st.target) * 100));
    const minPct = Math.min(100, Math.round(st.min / Math.max(1, st.target) * 100));
    return h`
      <button class="btn btn-outline btn-sm" data-act="back-from-item" style="margin-bottom:16px;">${ICONS.back} Zurück</button>
      <div class="eyebrow">${esc(it.category)}${box?" · "+esc(box.name):""}</div>
      <h2 class="section-title">${esc(it.name)}</h2>
      ${it.description ? `<p class="lead">${esc(it.description)}</p>` : ""}

      ${bildBlock(it)}

      <div class="detail-stock lv-${st.level}">
        <div class="ds-top">
          <span class="ds-num">${st.stock}<small>/ ${st.target}</small></span>
          <span class="tag lv-${st.level}">${statusDot(st.level)}${st.label}${st.need?" · +"+st.need:""}</span>
        </div>
        <div class="ds-track">
          <i class="ds-fill lv-${st.level}" style="width:${pct}%"></i>
          <i class="ds-mark" style="left:${minPct}%"></i>
        </div>
        <div class="ds-legend">
          <span>Mindestbestand <b>${st.min}</b></span>
          <span>Sollbestand <b>${st.target}</b></span>
        </div>
      </div>

      <div class="btn-row" style="margin:16px 0 9px;">
        <button class="btn btn-primary" data-act="qty-sheet" data-id="${it.id}" data-mode="entnahme" ${st.stock<=0?"disabled":""}>Entnehmen</button>
        <button class="btn btn-outline" data-act="qty-sheet" data-id="${it.id}" data-mode="auffuellen" data-preset="${Math.max(1,st.need)}">${ICONS.undo} Auffüllen</button>
      </div>
      <div class="btn-row" style="margin-bottom:20px;">
        <button class="btn btn-outline btn-sm" data-act="item-form" data-box="${it.boxId}" data-id="${it.id}">${ICONS.edit} Bearbeiten</button>
        <button class="btn btn-outline btn-sm" data-act="open-box" data-id="${it.boxId}">Zur Kiste</button>
      </div>

      <div class="subhead"><h3>Verlauf</h3></div>
      ${hist.length ? `<div class="panel">${hist.slice(0,40).map(movementRow).join("")}</div>`
        : emptyState("list","Noch keine Bewegung","Für dieses Material wurde noch nichts gebucht.")}`;
  }

  function renderRefill(){
    const low = lowItems();
    const r = readiness();
    const gruppen = {};
    low.forEach(x=>{ (gruppen[x.item.boxId] = gruppen[x.item.boxId] || []).push(x); });
    const boxIds = Object.keys(gruppen).sort((a,b)=>{
      const A = boxById(a), B = boxById(b);
      return String(A?A.sort:0) - String(B?B.sort:0) || String(a).localeCompare(String(b));
    });

    return h`
      <div class="eyebrow">Nachschub</div>
      <h2 class="section-title">Nachfüllen</h2>
      ${low.length ? h`
        <div class="refill-head">
          <div><span class="n">${low.length}</span><span class="l">Positionen</span></div>
          <div><span class="n">${r.need}</span><span class="l">Stück fehlen</span></div>
          <div><span class="n lv-crit">${r.crit}</span><span class="l">leer</span></div>
          <div><span class="n lv-warn">${r.warn}</span><span class="l">kritisch</span></div>
        </div>
        <div class="seg-switch">
          <button class="${state.refillGroup?"":"on"}" data-act="refill-mode" data-mode="liste">Nach Dringlichkeit</button>
          <button class="${state.refillGroup?"on":""}" data-act="refill-mode" data-mode="kiste">Nach Kiste</button>
        </div>
        ${state.refillGroup
          ? boxIds.map(bid=>{
              const b = boxById(bid), eintraege = gruppen[bid];
              const stueck = eintraege.reduce((a,x)=>a+x.need,0);
              const offen = state.groupOpen[bid] !== false;
              return h`
                <div class="group">
                  <button class="group-head" data-act="toggle-group" data-id="${bid}">
                    <span class="crate-id">${esc(String(bid).toUpperCase())}</span>
                    <span class="group-name">${b?esc(b.name):"Unbekannte Kiste"}</span>
                    <span class="group-meta">${eintraege.length} Positionen · ${stueck} Stück</span>
                    <span class="group-arrow ${offen?"open":""}">${ICONS.chevron}</span>
                  </button>
                  ${offen ? eintraege.map(refillCard).join("") : ""}
                </div>`;
            }).join("")
          : low.map(refillCard).join("")}
        <button class="btn btn-outline" style="width:100%;margin-top:16px;" data-act="export-csv">Liste als CSV exportieren</button>
      ` : h`
        <div class="empty-state ok-state">
          <div class="glyph lv-ok">${ICONS.check}</div>
          <strong>Alles bereit für den nächsten Einsatz</strong>
          <p>Alle ${r.total} Positionen erfüllen ihren Mindestbestand. Nichts nachzufüllen.</p>
        </div>`}`;
  }

  function refillCard(x){
    const box = boxById(x.item.boxId);
    return h`
      <div class="refill-card lv-${x.level}${state.flash===x.item.id?" flash":""}">
        <button class="rc-main" data-act="open-item" data-id="${x.item.id}">
          <span class="rc-name">${esc(x.item.name)}</span>
          <span class="rc-where">${box?esc(String(box.id).toUpperCase())+" · "+esc(x.item.category):esc(x.item.category)}</span>
          <span class="rc-values">
            <span><b>${x.stock}</b>Aktuell</span>
            <span><b>${x.min}</b>Mindest</span>
            <span><b>${x.target}</b>Soll</span>
          </span>
        </button>
        <button class="rc-add" data-act="quick-refill" data-id="${x.item.id}" data-n="${x.need}">
          +${x.need}
        </button>
      </div>`;
  }

  function renderMovements(){
    let mvs = effectiveMovements();
    if(state.filters.box) mvs = mvs.filter(m=> (m.boxId || (itemById(m.cableId)||{}).boxId) === state.filters.box);
    if(state.filters.category) mvs = mvs.filter(m=> (m.category || (itemById(m.cableId)||{}).category) === state.filters.category);
    if(state.filters.user) mvs = mvs.filter(m=> (m.user||"Unbekannt") === state.filters.user);
    const q = normalize(state.search);
    if(q) mvs = mvs.filter(m=> normalize((itemById(m.cableId)||{}).name || m.name || "").includes(q));
    const users = Array.from(new Set(state.movements.map(m=>m.user||"Unbekannt")));
    return h`
      <div class="eyebrow">Historie</div>
      <h2 class="section-title">Entnahmen &amp; Auffüllen</h2>
      <p class="lead">Läuft live mit: jede Buchung von jedem Gerät erscheint hier sofort.</p>
      <div class="filter-bar">
        <select id="filterCategory">
          <option value="">Alle Kategorien</option>
          ${allCategories().map(c=>`<option value="${esc(c)}" ${state.filters.category===c?"selected":""}>${esc(c)}</option>`).join("")}
        </select>
        <select id="filterBox">
          <option value="">Alle Kisten</option>
          ${state.boxes.map(b=>`<option value="${b.id}" ${state.filters.box===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}
        </select>
        <select id="filterUser">
          <option value="">Alle Mitarbeiter</option>
          ${users.map(u=>`<option value="${esc(u)}" ${state.filters.user===u?"selected":""}>${esc(u)}</option>`).join("")}
        </select>
      </div>
      ${mvs.length ? mvs.slice(0,200).map(movementRow).join("") : emptyState("list","Keine Einträge","Für diese Filter gibt es nichts.")}
      ${state.movements.length ? `<button class="btn btn-outline" style="width:100%;margin-top:14px;" data-act="export-csv">Als CSV exportieren</button>` : ""}`;
  }

  function renderSettings(){
    return h`
      <div class="eyebrow">Einstellungen</div>
      <h2 class="section-title">Dein Gerät</h2>
      <div class="field">
        <label class="field-label" for="userNameInput">Dein Name (erscheint bei jeder Buchung)</label>
        <input class="kicker-input" id="userNameInput" placeholder="z. B. M. Keller" value="${esc(state.user)}">
        <div class="hint">Bleibt auf diesem Gerät gespeichert.</div>
      </div>

      <div class="subhead"><h3>App aufs Handy</h3></div>
      ${deferredPrompt
        ? `<button class="btn btn-accent" data-act="install">App installieren</button>`
        : h`<div class="empty-state" style="text-align:left;padding:14px 16px;">
             <strong style="margin-bottom:6px;">So installierst du sie</strong>
             <p style="margin:0;"><b>iPhone:</b> Seite in Safari öffnen → Teilen-Symbol → „Zum Home-Bildschirm".<br>
             <b>Android:</b> Chrome → Menü (⋮) → „App installieren".</p>
           </div>`}

  function problemBanner(){
    if(!firebaseConfigured()){

    }
    if(state.sendError){
      return `<div class="banner">Firebase hat die Buchung abgelehnt (${esc(state.sendError)}). ${state.outbox.length} warten auf diesem Gerät.<button data-act="diagnose">Prüfen</button></div>`;

    if(state.authError){
      return `<div class="banner">Anmeldung bei Firebase nicht möglich – Buchungen bleiben auf diesem Gerät liegen.<button data-act="diagnose">Prüfen</button></div>`;
    }
    if(state.outbox.length){
      return `<div class="banner">${state.outbox.length} Buchung(en) noch nicht gesendet.<button data-act="send-now">Jetzt senden</button></div>`;

  function render(){

    else if(state.view==="refill") body = renderRefill();
    else if(state.view==="movements") body = renderMovements();
    else if(state.view==="settings") body = renderSettings();

    app.innerHTML = h`
      ${topbar()}
      <div class="view">${problemBanner()}${body}</div>
      <div class="footer-note">Bestände werden über Firebase live zwischen allen Geräten synchronisiert</div>

    if(activeId){
      const el = document.getElementById(activeId);

  /* ================================================================
     Hinweise (Toast) mit Rückgängig
     ================================================================ */
  let toastTimer = null;
  function toast(msg, cls, action){
    clearTimeout(toastTimer);
    const old = document.querySelector(".toast");
    if(old) old.remove();
    const t = document.createElement("div");
    t.className = "toast " + (cls||"");
    const span = document.createElement("span");
    span.className = "t";
    span.textContent = msg;
    t.appendChild(span);
    if(action){
      const b = document.createElement("button");
      b.textContent = action.label;
      b.addEventListener("click", ()=>{ t.remove(); action.fn(); });
      t.appendChild(b);
    }
    document.body.appendChild(t);
    toastTimer = setTimeout(()=> t.remove(), action ? 6000 : 3400);
  }

     ================================================================ */
  const sheetLayer = document.getElementById("sheet-layer");
  const sheetEl = document.getElementById("sheet");
  let sheetOpen = false, sheetCloseCb = null;
  function openSheet(html, tall, onClose){
    sheetEl.className = "sheet" + (tall ? " tall" : "");
    sheetEl.innerHTML = `<div class="grip"></div>` + html;
    sheetLayer.classList.add("open");
    sheetLayer.setAttribute("aria-hidden","false");
    sheetOpen = true; sheetCloseCb = onClose || null;
    document.body.style.overflow = "hidden";
  }
  function closeSheet(){
    if(!sheetOpen) return;
    sheetLayer.classList.remove("open");
    sheetLayer.setAttribute("aria-hidden","true");
    sheetOpen = false;
    document.body.style.overflow = "";
    const cb = sheetCloseCb; sheetCloseCb = null;
    if(cb) cb();
  }

    imgs.forEach(im=>{ if(im.complete) go(); else { im.onload = go; im.onerror = go; } });
  }

  /* ---------- Verbindung prüfen ---------- */
  const RULES_TEXT = JSON.stringify({
    rules: {
      materiallager: {
        ".read": "auth != null",
        ".write": "auth != null",
        movements: { ".indexOn": ["ts"] }
      }
    }
  }, null, 2);

  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise((_,rej)=> setTimeout(()=>rej(Object.assign(new Error("Zeitüberschreitung"), {code:"TIMEOUT"})), ms))
    ]);
  }

  async function runDiagnose(){
    const out = [];
    out.push({ok:true, title:"App-Version", txt: APP_VERSION});
    out.push({ok: firebaseConfigured(), title:"Konfiguration",
              txt: firebaseConfigured() ? "Projekt " + firebaseConfig.projectId : "In index.html fehlen die Firebase-Angaben."});

    if(!db || !auth){
      out.push({ok:false, title:"Verbindung", txt:"Firebase konnte nicht gestartet werden.",
                hint: state.error || "Seite neu laden."});
      return out;
    }

    // 1. Anmeldung
    try{
      await withTimeout(signInAnonymously(auth), 12000);
      state.authOk = true; state.authError = "";
      out.push({ok:true, title:"Anonyme Anmeldung", txt:"funktioniert"});
    }catch(e){
      const code = e.code || e.message;
      state.authOk = false; state.authError = code;
      out.push({ok:false, title:"Anonyme Anmeldung", txt:String(code), hint: fbHint(code, e.message)});
    }

    // 2. Buchungen lesen – der Pfad, den es seit jeher gibt
    try{
      const snap = await withTimeout(get(ref(db, DB_ROOT + "/movements")), 12000);
      const n = Object.keys(snap.val() || {}).length;
      out.push({ok:true, title:"Buchungen lesen", txt: n + " Einträge im Verlauf"});
    }catch(e){
      const code = e.code || e.message;
      out.push({ok:false, title:"Buchungen lesen", txt:String(code), hint: fbHint(code, e.message)});
    }

    // 3. Buchung senden – zuerst die echte Warteschlange
    let writeOk = false, writeErr = "";
    if(state.outbox.length){
      const before = state.outbox.length;
      await flushOutbox();
      const done = before - state.outbox.length;
      if(state.outbox.length === 0){
        writeOk = true;
        out.push({ok:true, title:"Buchung senden", txt: done + " wartende Buchung(en) sind durchgegangen"});
      }else{
        writeErr = state.sendError || "abgelehnt";
      }
    }

    // Wenn das nicht ging: herausfinden, woran es liegt
    if(!writeOk){
      const now = new Date();
      const voll = {
        cableId: PROBE_ID, type:"entnahme", qty:0, user: state.user || "",
        date: now.toLocaleDateString("de-CH"),
        time: now.toLocaleTimeString("de-CH", {hour:"2-digit", minute:"2-digit"}),
        ts: Date.now(), serverTs: serverTimestamp()
      };
      const knapp = { cableId: PROBE_ID, type:"entnahme", qty:0 };

      let vollOk = false, vollErr = "", knappOk = false, knappErr = "";
      try{
        const r = await withTimeout(push(ref(db, DB_ROOT + "/movements"), voll), 12000);
        vollOk = true; try{ await remove(r); }catch(e){}
      }catch(e){ vollErr = e.code || e.message; }

      if(!vollOk){
        try{
          const r2 = await withTimeout(push(ref(db, DB_ROOT + "/movements"), knapp), 12000);
          knappOk = true; try{ await remove(r2); }catch(e){}
        }catch(e){ knappErr = e.code || e.message; }
      }

      if(vollOk){
        state.sendError = "";
        out.push({ok:true, title:"Buchung senden", txt:"Testbuchung im gewohnten Format gespeichert"});
        if(writeErr){
          out.push({ok:false, title:"Warteschlange", txt:"Ältere Buchungen wurden abgelehnt: " + writeErr,
                    hint:"Diese stammen noch aus einer früheren App-Fassung mit zusätzlichen Feldern. Unter Einstellungen → Warteschlange verwerfen und neu buchen."});
        }
      }else if(knappOk){
        out.push({ok:false, title:"Buchung senden", txt:"Nur mit reduziertem Inhalt möglich (" + vollErr + ")",
                  hint:"Deine Regeln lassen bestimmte Felder nicht zu. Schick mir diese Zeile – dann passe ich das Format an. Erlaubt sind offenbar cableId, type und qty, abgelehnt wird eines der Felder user, date, time, ts oder serverTs."});
      }else{
        out.push({ok:false, title:"Buchung senden", txt: String(vollErr || writeErr),
                  hint:"Die Regeln lassen unter materiallager/movements gar kein Schreiben zu. Regeln unten einsetzen und veröffentlichen."});
      }
    }

    // 3b. Bildspeicher
    if(storage){
      try{
        const probe = sRef(storage, "service-material/_pruefung/probe.txt");
        await withTimeout(uploadBytes(probe, new Blob(["ok"], {type:"text/plain"}), {contentType:"text/plain"}), 15000);
        try{ await withTimeout(deleteObject(probe), 10000); }catch(e){}
        out.push({ok:true, title:"Bildspeicher", txt:"Storage funktioniert"});
      }catch(e){
        out.push({ok:false, optional:true, title:"Bildspeicher (optional)",
                  txt:String(e.code || e.message || e),
                  hint: bildFehler(e) || "Nur für Artikelbilder nötig. Konsole → Build → Storage → Jetzt starten, danach storage.rules veröffentlichen."});
      }
    }else{
      out.push({ok:false, optional:true, title:"Bildspeicher (optional)", txt:"nicht eingerichtet",
                hint:"Nur für Artikelbilder nötig. Konsole → Build → Storage → Jetzt starten."});
    }

    // 4. Katalog – nur für das Anlegen von Material nötig
    let boxCount = null;
    try{
      const snap = await withTimeout(get(ref(db, DB_ROOT + "/catalog/boxes")), 12000);
      boxCount = Object.keys(snap.val() || {}).length;
      if(boxCount === 0){
        await ensureCatalog();
        out.push({ok:true, title:"Katalog", txt:"12 Kisten mit allem Material wurden angelegt"});
      }else{
        state.catalogDenied = false;
        out.push({ok:true, title:"Katalog", txt: boxCount + " Kisten in der Datenbank"});
      }
    }catch(e){
      const code = e.code || e.message;
      state.catalogDenied = true;
      out.push({ok:false, optional:true, title:"Katalog (optional)", txt:String(code),
                hint:"Entnehmen und Auffüllen laufen trotzdem – die App nimmt dafür die eingebaute Materialliste. Nur das Anlegen von neuem Material in der App braucht die erweiterte Regel unten."});
    }

    return out;
  }

  /* ---------- Scanner ---------- */
  let camStream = null, camStop = false, torchOn = false;
  async function startScan(){
    camStop = false; torchOn = false;
    openSheet(h`
      <h2>Kiste scannen</h2>
      <p class="sub">QR-Code der Kiste in den Rahmen halten.</p>
      <div class="cam-wrap">
        <video id="cam" playsinline muted autoplay></video>
        <div class="reticle"><i></i><i></i><i></i><i></i></div>
        <button class="torch hide" id="torch" data-act="scan-torch" aria-pressed="false" aria-label="Licht">${ICONS.bolt}</button>
        <div class="cam-note" id="camNote">Kamera startet …</div>
      </div>
      <div class="field">
        <label class="field-label" for="manualCode">Oder Nummer eingeben</label>
        <input id="manualCode" placeholder="z. B. K01" autocapitalize="characters" autocomplete="off">
      </div>
      <button class="btn btn-primary" data-act="manual-open">Kiste öffnen</button>
      <button class="btn btn-outline" style="width:100%;margin-top:8px;" data-act="sheet-close">Abbrechen</button>
    `, true, stopScan);

    const video = document.getElementById("cam");
    const note = document.getElementById("camNote");
    try{
      camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false});
      video.srcObject = camStream;
      await video.play();
      note.textContent = "Suche QR-Code …";
      const track = camStream.getVideoTracks()[0];
      if(track.getCapabilities && track.getCapabilities().torch){
        document.getElementById("torch").classList.remove("hide");
      }
    }catch(e){
      note.textContent = "Kein Kamerazugriff";
      toast("Kamera nicht verfügbar – Nummer von Hand eingeben.","bad");
      return;
    }
    if("BarcodeDetector" in window){
      try{
        const det = new window.BarcodeDetector({formats:["qr_code"]});
        const tick = async ()=>{
          if(camStop) return;
          try{
            const codes = await det.detect(video);
            if(codes && codes[0] && codes[0].rawValue) return handleScan(codes[0].rawValue);
          }catch(e){}
          requestAnimationFrame(tick);
        };
        return requestAnimationFrame(tick);
      }catch(e){}
    }
    try{ await loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"); }
    catch(e){ note.textContent = "Scanner offline – Nummer eingeben"; return; }
    const cv = document.createElement("canvas");
    const ctx = cv.getContext("2d", {willReadFrequently:true});
    const tick = ()=>{
      if(camStop) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        cv.width = video.videoWidth; cv.height = video.videoHeight;
        ctx.drawImage(video,0,0,cv.width,cv.height);
        const img = ctx.getImageData(0,0,cv.width,cv.height);
        const res = window.jsQR(img.data, img.width, img.height, {inversionAttempts:"dontInvert"});
        if(res && res.data) return handleScan(res.data);
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  function stopScan(){
    camStop = true;
    if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; }
  }
  async function toggleTorch(){
    if(!camStream) return;
    const track = camStream.getVideoTracks()[0];
    torchOn = !torchOn;
    try{
      await track.applyConstraints({advanced:[{torch:torchOn}]});
      document.getElementById("torch").setAttribute("aria-pressed", String(torchOn));
    }catch(e){ toast("Licht wird von diesem Gerät nicht unterstützt."); }
  }
  function handleScan(text){
    stopScan();
    if(navigator.vibrate) navigator.vibrate([12,30,12]);
    sheetCloseCb = null;
    closeSheet();
    setTimeout(()=>openByCode(text), 150);
  }
  function openByCode(text){
    let code = String(text||"").trim();
    try{
      if(/^https?:/i.test(code)){
        const u = new URL(code);
        code = u.searchParams.get("kiste") || code;
      }
    }catch(e){}
    code = code.replace(/^kiste[:=]/i,"").trim();
    const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
    const box = state.boxes.find(b=>norm(b.id)===norm(code))
             || state.boxes.find(b=>norm(b.name)===norm(code));
    if(box){
      state.activeBoxId = box.id; state.view = "boxDetail"; state.boxCat = "";
      state.selection = {}; state.search = "";
      render();
      window.scrollTo({top:0});
    }else{
      toast("Keine Kiste zu „"+code+"\u201C gefunden.","bad");
    }
  }

  /* ---------- CSV ---------- */
  function exportCsv(){
    const rows = [["Datum","Zeit","Kiste","Material","Kategorie","Menge","Art","Person"]];
    effectiveMovements().forEach(m=>{
      const it = itemById(m.cableId) || {};
      rows.push([
        m.date||"", m.time||"",
        m.boxName || (boxById(it.boxId)||{}).name || "",
        m.name || it.name || "",
        m.category || it.category || "",
        movementDelta(m), m.type||"", m.user||""
      ]);
    });
    const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
    const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "materiallager-verlauf.csv";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }

  function book(itemId, mode, qty){
    const it = itemById(itemId); if(!it) return;
    const stock = currentStock(itemId);
    if(mode === "entnahme" && qty > stock){
      toast("Nur noch " + stock + " Stk. vorhanden.","bad");
      return;
    }
    const mv = bookMovement(itemId, mode === "entnahme" ? "entnahme" : "rueckgabe", qty);
    state.flash = itemId;
    setTimeout(()=>{ if(state.flash === itemId){ state.flash = null; render(); } }, 700);
    render();
    const rest = currentStock(itemId);
    const nachher = statusOf(it);
    if(navigator.vibrate) navigator.vibrate(nachher.level === "crit" ? [16,40,16] : 16);
    toast((mode==="entnahme"?"Entnommen: ":"Aufgefüllt: ") + qty + " × " + it.name + " · Bestand " + rest + " / " + nachher.target,
      "", {label:"Rückgängig", fn:()=>{ undoMovement(mv).then(()=>{ invalidate(); render(); }); }});
    if(mode==="entnahme" && nachher.level !== "ok"){
      setTimeout(()=>toast(it.name + (nachher.level==="crit" ? " ist aufgebraucht" : " ist unter dem Mindestbestand") + " – nachfüllen: +" + nachher.need, "bad"), 900);
    }
  }

  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt = e; });

  document.addEventListener("click", async (ev)=>{
    const lb = document.getElementById("lightbox");
    if(lb && lb.classList.contains("open") && ev.target === lb){ bildGrossZu(); return; }
    const navEl = ev.target.closest("[data-nav]");
    if(navEl){
      const target = navEl.getAttribute("data-nav");
      closeSheet();
      state.view = target; state.search = ""; state.selection = {};
      render(); window.scrollTo({top:0});
      return;
    }
    const el = ev.target.closest("[data-act]");
    if(!el) return;
    const act = el.getAttribute("data-act");
    const id = el.getAttribute("data-id");
    const boxId = el.getAttribute("data-box");

    switch(act){
      case "sheet-close": closeSheet(); break;
      case "scan": startScan(); break;
      case "scan-torch": toggleTorch(); break;
      case "manual-open": {
        const v = (document.getElementById("manualCode")||{}).value;
        if(v && v.trim()){ sheetCloseCb = null; stopScan(); closeSheet(); openByCode(v); }
        break;
      }
      case "open-box":
        state.activeBoxId = id; state.view = "boxDetail"; state.boxCat = "";
        state.selection = {}; state.search = "";
        render(); window.scrollTo({top:0});
        break;
      case "open-item":
        state.activeItemId = id; state.view = "itemDetail";
        render(); window.scrollTo({top:0});
        break;
      case "back-from-item": {
        const it = itemById(state.activeItemId);
        if(it && state.activeBoxId === it.boxId){ state.view = "boxDetail"; }
        else { state.view = "cables"; }
        render();
        break;
      }
      case "take-one": book(id, "entnahme", 1); break;
      case "sel-plus": case "sel-minus": {
        const st = currentStock(id);
        let v = state.selection[id] || 1;
        v = act==="sel-plus" ? Math.min(st, v+1) : Math.max(1, v-1);
        state.selection[id] = v; render();
        break;
      }
      case "confirm-take": {
        const entries = Object.entries(state.selection).filter(([iid,q])=> q>0 && itemById(iid));
        if(!entries.length) break;
        let count = 0;
        entries.forEach(([iid,q])=>{
          const stock = currentStock(iid);
          const qty = Math.min(q, stock);
          if(qty > 0){ bookMovement(iid, "entnahme", qty); count += qty; }
        });
        state.selection = {}; invalidate(); render();
        if(navigator.vibrate) navigator.vibrate(24);
        toast(count + " Stück entnommen · gespeichert");
        break;
      }
      case "box-cat": state.boxCat = el.getAttribute("data-cat")||""; render(); break;
      case "refill-mode": state.refillGroup = el.getAttribute("data-mode")==="kiste"; render(); break;
      case "toggle-group": {
        state.groupOpen[id] = state.groupOpen[id] === false ? true : false;
        render(); break;
      }
      case "quick-refill": {
        const n = Math.max(1, toInt(el.getAttribute("data-n"),1));
        book(id, "auffuellen", n);
        break;
      }
      case "filter-empty": {
        state.filters = {box:"", category:"", user:"", status:"leer"};
        state.view = "cables"; state.search = ""; render(); window.scrollTo({top:0});
        break;
      }
      case "qty-sheet": sheetQty(id, el.getAttribute("data-mode")||"entnahme", el.getAttribute("data-preset")||1); break;
      case "qty-plus": qtyVal++; document.getElementById("qtyVal").textContent = qtyVal; break;
      case "qty-minus": qtyVal = Math.max(1, qtyVal-1); document.getElementById("qtyVal").textContent = qtyVal; break;
      case "qty-set": qtyVal = toInt(el.getAttribute("data-n"),1); document.getElementById("qtyVal").textContent = qtyVal; break;
      case "qty-book": {
        const iid = qtyItemId, mode = qtyMode, q = qtyVal;
        closeSheet();
        book(iid, mode==="entnahme"?"entnahme":"auffuellen", q);
        break;
      }

      case "img-pick": bildWaehlen(id); break;
      case "img-cancel": state.uploading = null; render(); toast("Vorgang abgebrochen."); break;
      case "img-clear-error": state.imageError = ""; render(); break;
      case "img-delete": bildLoeschen(id, false); break;
      case "img-open": bildGross(id); break;
      case "img-close": bildGrossZu(); break;
      case "item-form": sheetItemForm(boxId || (itemById(id)||{}).boxId, id||null); break;
      case "add-material": {
        if(state.boxes.length === 1) sheetItemForm(state.boxes[0].id, null);
        else sheetPickBox();
        break;
      }
      case "pick-box": sheetItemForm(id, null); break;
      case "item-save": {
        const name = (document.getElementById("f-name").value||"").trim();
        if(!name){ toast("Bezeichnung fehlt.","bad"); break; }
        let cat = document.getElementById("f-cat").value;
        if(cat === "__new"){ cat = (document.getElementById("f-cat-new").value||"").trim(); }
        if(!cat){ toast("Kategorie fehlt.","bad"); break; }
        const qty = Math.max(0, toInt(document.getElementById("f-qty").value,0));
        const min = Math.max(1, toInt(document.getElementById("f-min").value,1));
        const target = Math.max(min, toInt((document.getElementById("f-target")||{}).value, qty || 1));
        const desc = (document.getElementById("f-desc").value||"").trim();
        const zielBox = (document.getElementById("f-box")||{}).value || boxId;
        el.disabled = true; el.textContent = "Wird gespeichert …";
        try{
          if(id){
            const before = currentStock(id);
            await saveItem(null, id, {name, category:cat, minStock:min, targetStock:target, description:desc, boxId:zielBox});
            if(qty !== before){
              const diff = qty - before;
              bookMovement(id, diff > 0 ? "rueckgabe" : "entnahme", Math.abs(diff));
            }
            toast("Gespeichert.");
          }else{
            await saveItem(zielBox, null, {name, category:cat, initialStock:qty, minStock:min, targetStock:target, description:desc});
            toast(name + " angelegt.");
          }
          closeSheet(); invalidate(); render();
        }catch(e){
          el.disabled = false; el.textContent = "Nochmals versuchen";
          toast("Speichern fehlgeschlagen: " + (e.message||e), "bad");
        }
        break;

        const it = itemById(id);
        if(!it) break;
        if(!confirm('"'+it.name+'" wirklich aus der Kiste löschen? Der Verlauf bleibt erhalten.')) break;
        try{
          await deleteItem(id);
          closeSheet();
          if(state.view==="itemDetail"){ state.view = "boxDetail"; state.activeBoxId = it.boxId; }
          render(); toast("Gelöscht.");
        }catch(e){ toast("Löschen fehlgeschlagen: " + (e.message||e), "bad"); }
        break;
      }

      case "box-form": sheetBoxForm(id||null); break;
      case "box-save": {
        const name = (document.getElementById("f-boxname").value||"").trim();
        const desc = (document.getElementById("f-boxdesc").value||"").trim();
        if(!name){ toast("Bezeichnung fehlt.","bad"); break; }
        try{
          if(id){
            await saveBox(id, {name, description:desc}, false);
            toast("Kiste gespeichert.");
          }else{
            const newIdVal = (document.getElementById("f-boxid").value||"").trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
            if(!newIdVal){ toast("Nummer fehlt.","bad"); break; }
            if(boxById(newIdVal)){ toast("Nummer "+newIdVal.toUpperCase()+" ist schon vergeben.","bad"); break; }
            await saveBox(newIdVal, {name, description:desc}, true);
            state.activeBoxId = newIdVal; state.view = "boxDetail";
            toast("Kiste " + newIdVal.toUpperCase() + " angelegt.");
          }
          closeSheet(); render();
        }catch(e){ toast("Speichern fehlgeschlagen: " + (e.message||e), "bad"); }
        break;
      }
      case "box-delete": {
        const b = boxById(id); if(!b) break;
        if(!confirm("Kiste " + b.name + " inklusive allem Material löschen?")) break;
        try{
          await deleteBox(id);
          closeSheet(); state.view = "boxes"; render(); toast("Kiste gelöscht.");
        }catch(e){ toast("Löschen fehlgeschlagen: " + (e.message||e), "bad"); }
        break;
      }

      case "diagnose": case "diagnose-run": {
        sheetDiagnose(null, true);
        state.error = ""; state.errorCode = "";
        const res = await runDiagnose();
        state.diag = res;
        if(res.every(r=>r.ok)){ state.authError = ""; state.error = ""; state.errorCode = ""; }
        sheetDiagnose(res, false);
        render();
        break;
      }
      case "drop-queue": {
        if(!confirm(state.outbox.length + " wartende Buchung(en) endgültig verwerfen? Die Bestände zählen sie dann nicht mehr mit.")) break;
        state.outbox = []; state.sendError = ""; saveOutbox(); invalidate();
        closeSheet(); render(); toast("Warteschlange geleert.");
        break;
      }
      case "send-now": {
        state.sendError = "";
        render();
        await flushOutbox();
        toast(state.outbox.length ? state.outbox.length + " Buchung(en) warten weiterhin." : "Alles gesendet.");
        break;
      }
      case "copy-rules": {
        try{
          await navigator.clipboard.writeText(RULES_TEXT);
          toast("Regeln kopiert – in Firebase einfügen und veröffentlichen.");
        }catch(e){
          const box = document.getElementById("rulesBox");
          if(box){ box.focus(); box.select && box.select(); }
          toast("Bitte den Text von Hand markieren und kopieren.","bad");
        }
        break;
      }
      case "force-update": forceUpdate(); break;
      case "show-qr": sheetQr(id); break;
      case "labels": sheetLabels(); break;
      case "label-all": state.boxes.forEach(b=>state.labelSel[b.id]=true); sheetLabels(); break;
      case "label-none": state.labelSel = {}; sheetLabels(); break;
      case "label-print": {
        const ids = Object.keys(state.labelSel).filter(k=>state.labelSel[k]);
        closeSheet();
        printLabels(ids.length ? ids : state.boxes.map(b=>b.id));
        break;
      }
      case "print-one": closeSheet(); printLabels([id]); break;

      case "save-baseurl": {
        const v = (document.getElementById("baseUrlInput").value||"").trim();
        localSet("baseUrl", v);
        toast("Adresse gespeichert – Etiketten neu drucken.");
        break;
      }
      case "install":
        if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; }
        break;
      case "export-csv": exportCsv(); break;
      case "reset-history": {
        if(!requireLive()) break;
        if(!confirm("Wirklich den kompletten Verlauf für ALLE Geräte löschen? Die Bestände starten dann wieder beim erfassten Ausgangswert.")) break;
        try{
          await remove(ref(db, DB_ROOT + "/movements"));
          state.movements = []; state.outbox = []; saveOutbox(); invalidate(); render();
          toast("Verlauf zurückgesetzt.");
        }catch(e){ toast("Zurücksetzen fehlgeschlagen: " + (e.message||e), "bad"); }
        break;
      }
    }
  });

  document.addEventListener("change", (ev)=>{
    const t = ev.target;
    if(t.matches("[data-pick]")){
      const iid = t.getAttribute("data-pick");
      if(t.checked) state.selection[iid] = state.selection[iid] || 1;
      else delete state.selection[iid];
      render();
      return;
    }

      const bid = t.getAttribute("data-label");

      return;

      if(minEl && !minEl.dataset.touched) minEl.value = suggestMin(toInt(t.value,1));

    if(t.id === "f-cat"){
      const extra = document.getElementById("f-cat-new");
      if(extra){ extra.classList.toggle("hide", t.value !== "__new"); if(t.value === "__new") extra.focus(); }

    if(t.id === "filterCategory"){ state.filters.category = t.value; render(); return; }
    if(t.id === "filterBox"){ state.filters.box = t.value; render(); return; }
    if(t.id === "filterUser"){ state.filters.user = t.value; render(); return; }
    if(t.id === "userNameInput"){
      state.user = t.value.trim();
      localSet("current-user", state.user);
      toast(state.user ? "Name gespeichert: " + state.user : "Name entfernt.");
      return;
    }
  });

  let searchTimer = null;
  document.addEventListener("input", (ev)=>{
    const t = ev.target;
    if(t.id === "f-target"){
      const minEl = document.getElementById("f-min");
      if(minEl && !minEl.dataset.touched) minEl.value = suggestMin(toInt(t.value,1));
      return;
    }
    if(t.id === "f-min"){ t.dataset.touched = "1"; return; }
    if(t.id === "globalSearch"){
      state.search = t.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(render, 140);   // erst tippen, dann neu zeichnen
      return;
    }
    if(t.matches("[data-qty]")){
      const iid = t.getAttribute("data-qty");
      const max = currentStock(iid);
      let v = toInt(t.value,1);
      if(v < 1) v = 1;
      if(v > max) { v = max; t.value = String(max); }
      state.selection[iid] = v;
      return;
    }
  });

  document.addEventListener("keydown", e=>{
    if(e.key !== "Escape") return;
    const lb = document.getElementById("lightbox");
    if(lb && lb.classList.contains("open")) bildGrossZu();
    else closeSheet();
  });

  /* ================================================================
     Start
     ================================================================ */
  async function init(){
    loadFromCache();
    state.user = localGet("current-user") || "";
    state.ready = true;
    render();

    const params = new URLSearchParams(location.search);
    const kiste = params.get("kiste");
    if(kiste) setTimeout(()=>openByCode(kiste), 60);

    if(!firebaseConfigured()){
      toast("Firebase nicht eingerichtet – Konfiguration in index.html eintragen.","bad");
      return;
    }
    try{
      await initFirebase();
      render();
      flushOutbox();
    }catch(e){
      console.error("Firebase", e);
      state.error = e.message || String(e);
      state.online = false;
      render();
      toast("Keine Verbindung zu Firebase: " + state.error, "bad");
    }
  }

  if(navigator.serviceWorker && location.protocol.indexOf("http") === 0){
    let reloadedOnce = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(reloadedOnce) return;
      reloadedOnce = true;
      location.reload();          // neue Fassung ist da – einmal sauber neu starten
    });
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("./sw.js", {updateViaCache:"none"})
        .then(reg=>{ reg.update(); })
        .catch(()=>{});
    });
  }

  /* Notbremse, falls trotzdem eine alte Fassung hängen bleibt */
  async function forceUpdate(){
    try{
      if(navigator.serviceWorker){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      if(window.caches){
        const keys = await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
    }catch(e){}
    location.href = location.pathname + "?frisch=" + Date.now();
  }

  init();
})();
</script>
</body>
</html>
